nsabile del loro caratteristico colore blu-viola?", "opts": ["Carotenoidi", "Flavonoli", "Tannini", "Antociani"], "ans": 3, "cat": "cibo", "expl": "Gli antociani sono pigmenti idrosolubili responsabili dei colori blu, viola e rosso di molti frutti, tra cui i mirtilli. Agiscono anche come potenti antiossidanti naturali. La loro concentrazione aumenta con l'esposizione solare del frutto."}, {"q": "Chi scrisse e incise per primo \"Nothing Compares 2 U\", resa celebre dalla cover di Sinéad O'Connor nel 1990?", "opts": ["Chris Isaak", "Peter Gabriel", "Prince", "George Michael"], "ans": 2, "cat": "musica", "expl": "Prince scrisse e incise \"Nothing Compares 2 U\" nel 1985 per il gruppo The Family, senza successo commerciale. Sinéad O'Connor la reincise nel 1990, portandola al numero uno in molte classifiche mondiali. Prince stesso la eseguì poi dal vivo dopo il successo di O'Connor."}, {"q": "Quale scrittrice inglese dell'Ottocento fu per alcuni anni redattrice della rivista intellettuale \"Westminster Review\" prima di dedicarsi alla narrativa?", "opts": ["George Eliot", "Elizabeth Gaskell", "Harriet Martineau", "Anne Brontë"], "ans": 0, "cat": "letteratura", "expl": "George Eliot, pseudonimo di Mary Ann Evans, diresse la Westminster Review dal 1851 al 1854. L'esperienza editoriale la mise in contatto con gli intellettuali vittoriani più influenti. Pubblicò poi romanzi come \"Middlemarch\" sotto pseudonimo maschile per essere presa sul serio."}, {"q": "Completa: \"I look forward to ___ from you soon.\"", "opts": ["hear", "heard", "to hear", "hearing"], "ans": 3, "cat": "inglese", "expl": "Dopo \"look forward to\", la preposizione \"to\" regge un gerundio, non l'infinito. È un errore comune anche per madrelingua confondere \"to\" preposizionale con \"to\" dell'infinito. La forma corretta è quindi \"hearing\", non \"hear\" o \"to hear\"."}, {"q": "Cosa significa il termine italiano \"uggia\"?", "opts": ["Allegria improvvisa", "Noia mista a fastidio persistente", "Curiosità morbosa", "Timidezza eccessiva"], "ans": 1, "cat": "lingua_italiana", "expl": "\"Uggia\" indica un senso di noia mista a fastidio e insofferenza, spesso legato al tempo atmosferico grigio. È un termine tipicamente letterario, oggi poco usato nel parlato comune. Compare in testi di autori come Leopardi e Pascoli."}, {"q": "Le lettere di COSTELLAZIONI possono essere riordinate per formare quale delle seguenti parole?", "opts": ["Straordinaria", "Imprenditoria", "Collezionista", "Conversazioni"], "ans": 2, "cat": "anagrammi", "expl": "COSTELLAZIONI e COLLEZIONISTA condividono le stesse tredici lettere. \"Collezionista\" è chi raccoglie sistematicamente oggetti di un certo tipo, per passione o studio. Nessun'altra opzione tra quelle proposte è un anagramma valido della parola di partenza."}, {"q": "Quale insieme numerico comprende sia i numeri razionali sia gli irrazionali?", "opts": ["Numeri complessi", "Numeri interi", "Numeri naturali", "Numeri reali"], "ans": 3, "cat": "matematica", "expl": "I numeri reali comprendono sia i razionali, esprimibili come frazione, sia gli irrazionali, come π e √2. L'insieme fu formalizzato rigorosamente solo nell'Ottocento, con Dedekind e Cantor. I numeri complessi, invece, includono anche l'unità immaginaria e non sono un sottoinsieme dei reali."}, {"q": "Cosa significa il termine tedesco \"Torschlusspanik\"?", "opts": ["La paura di lasciarsi sfuggire il tempo per un obiettivo di vita", "Il timore di aver chiuso la porta di casa senza chiave", "L'ansia da prestazione prima di un esame", "Il rimpianto per un'occasione mancata nel passato"], "ans": 0, "cat": "lingue", "expl": "\"Torschlusspanik\", letteralmente \"panico da chiusura del portone\", descrive l'ansia di perdere occasioni di vita importanti col passare del tempo. Il termine nacque riferito ai portoni delle città medievali chiusi al calar della notte. Oggi è usato soprattutto per l'ansia legata a carriera o famiglia."}, {"q": "Che lavoro faceva Quentin Tarantino prima di sfondare come regista?", "opts": ["Cameriere in un fast food", "Commesso in un videonoleggio", "Buttafuori in un locale", "Autista di autobus"], "ans": 1, "cat": "cinema", "expl": "Tarantino lavorò per anni come commesso al videonoleggio Video Archives di Manhattan Beach, in California. Lì sviluppò una cultura cinematografica enciclopedica che avrebbe poi riversato nei suoi film. Il negozio chiuse nel 1995, poco dopo il successo di \"Pulp Fiction\"."}, {"q": "I Simpson debuttarono come cortometraggi animati all'interno di quale show televisivo, prima di diventare una serie autonoma?", "opts": ["Saturday Night Live", "In Living Color", "The Tracey Ullman Show", "The Ben Stiller Show"], "ans": 2, "cat": "cinema", "expl": "I Simpson debuttarono come brevi sketch animati all'interno del \"The Tracey Ullman Show\" il 19 aprile 1987. Matt Groening li disegnò frettolosamente in sala d'attesa per evitare di cedere i diritti di personaggi propri. Divennero serie autonoma su Fox solo nel dicembre 1989."}, {"q": "Quale attore doppia, in originale, sia Homer sia il nonno Abraham Simpson?", "opts": ["Harry Shearer", "Hank Azaria", "Nancy Cartwright", "Dan Castellaneta"], "ans": 3, "cat": "cinema", "expl": "Dan Castellaneta doppia in originale sia Homer sia il nonno Abraham \"Abe\" Simpson, oltre a Krusty il Clown e Barney Gumble. È tra i doppiatori più prolifici della serie insieme a Hank Azaria. La sua voce di Homer nacque da un'imitazione improvvisata di Walter Matthau."}, {"q": "L'episodio \"Bart to the Future\", andato in onda nel 2000, immaginò con sorprendente anticipo quale evento politico reale?", "opts": ["L'elezione di Donald Trump alla presidenza degli Stati Uniti", "La vittoria del sì al referendum sulla Brexit nel Regno Unito", "La vittoria elettorale di Barack Obama alla Casa Bianca", "Lo scandalo Watergate che portò alle dimissioni di Nixon"], "ans": 0, "cat": "cinema", "expl": "Nell'episodio \"Bart to the Future\" (2000), Lisa diventa presidente succedendo a un predecessore chiamato \"President Trump\" che lascia il paese in crisi economica. Il riferimento divenne virale dopo l'elezione reale di Trump nel 2016. Lo sceneggiatore Dan Greaney lo definì una coincidenza più che una vera previsione."}, {"q": "In quale anno andò in onda il primo episodio della serie horror-antologica \"Treehouse of Horror\"?", "opts": ["1989", "1990", "1992", "1994"], "ans": 1, "cat": "cinema", "expl": "Il primo \"Treehouse of Horror\" andò in onda il 25 ottobre 1990, nella seconda stagione. Da allora è diventato un appuntamento fisso di fine ottobre, con episodi divisi in tre storie horror parodistiche. Non fa parte della continuity canonica della serie."}, {"q": "In quale anno l'esclamazione \"D'oh!\" di Homer Simpson fu ufficialmente aggiunta all'Oxford English Dictionary?", "opts": ["1998", "2003", "1995", "2001"], "ans": 3, "cat": "cinema", "expl": "L'esclamazione \"D'oh!\" entrò nell'Oxford English Dictionary nel 2001, dopo essere già comparsa nell'Oxford Dictionary of English nel 1998. La definizione ufficiale la descrive come espressione di frustrazione per un proprio errore. Dan Castellaneta la ideò improvvisando sul copione originale."}, {"q": "Perché lo stato americano in cui si trova Springfield non viene mai rivelato ufficialmente nella serie?", "opts": ["È un errore di continuità che gli autori non hanno mai corretto ufficialmente", "Lo stato cambia a ogni nuova stagione per una scelta stilistica dei produttori", "È una scelta deliberata degli sceneggiatori per rendere la città universale", "Fu rivelato una sola volta in un episodio, ma la rete impose di censurarlo"], "ans": 2, "cat": "cinema", "expl": "Gli sceneggiatori hanno sempre evitato deliberatamente di rivelare lo stato di Springfield, per mantenerla una città \"americana universale\" in cui ogni spettatore può riconoscersi. La geografia della serie è volutamente incoerente tra un episodio e l'altro. Il creatore Matt Groening ha confermato l'intenzionalità della scelta."}, {"q": "Quale record Guinness detiene \"I Simpson\" tra le serie televisive scripted in prima serata?", "opts": ["Serie scripted più longeva della storia della televisione", "Maggior numero di episodi prodotti in una singola stagione", "Cast vocale più numeroso mai accreditato", "Prima serie animata trasmessa in diretta"], "ans": 0, "cat": "cinema", "expl": "\"I Simpson\" detiene il Guinness World Record come serie televisiva scripted più longeva della storia della TV americana in prima serata. Ha superato nel 2018 lo storico western \"Gunsmoke\" per numero di episodi. La ventesima stagione fu anche insignita di una stella sulla Hollywood Walk of Fame."}, {"q": "In quale data debuttò \"I Simpson\" come serie autonoma, con l'episodio \"Simpsons Roasting on an Open Fire\"?", "opts": ["14 dicembre 1989", "1 gennaio 1990", "25 dicembre 1989", "17 dicembre 1989"], "ans": 3, "cat": "cinema", "expl": "\"Simpsons Roasting on an Open Fire\" debuttò il 17 dicembre 1989 su Fox, come primo episodio della serie autonoma. Fu scelto come pilota al posto di un altro episodio per motivi di tempistica produttiva legati al Natale. Ottenne ascolti molto alti, lanciando la serie."}, {"q": "Chi compose la celebre sigla orchestrale de \"I Simpson\"?", "opts": ["Danny Elfman", "James Horner", "Hans Zimmer", "John Williams"], "ans": 0, "cat": "cinema", "expl": "Danny Elfman compose la sigla orchestrale de \"I Simpson\" nel 1989, in appena due giorni di lavoro. Prima di allora era già noto per le colonne sonore dei film di Tim Burton. La sigla è rimasta sostanzialmente invariata per oltre trent'anni di trasmissioni."}, {"q": "Quale attore presta la voce, in originale, a Bob Terwilliger, alias Sideshow Bob, ne \"I Simpson\"?", "opts": ["John Lithgow", "Patrick Stewart", "Kelsey Grammer", "Malcolm McDowell"], "ans": 2, "cat": "cinema", "expl": "Kelsey Grammer, celebre anche per il ruolo di Frasier Crane in \"Cheers\" e \"Frasier\", doppia Bob Terwilliger fin dal 1990. Vinse un Emmy per la sua interpretazione del personaggio. È uno dei pochi ruoli ricorrenti affidati a un attore esterno al cast fisso."}, {"q": "Nel film \"I Simpson - Il film\", uscito nel 2007, cosa scatena il disastro ambientale che porta Springfield a essere isolata sotto una cupola?", "opts": ["Una perdita radioattiva dalla centrale nucleare di Mr. Burns", "Un incendio doloso nella discarica comunale", "Un esperimento di Homer sull'energia solare andato storto", "I rifiuti del porcile di Homer riversati nel lago"], "ans": 3, "cat": "cinema", "expl": "Nel film del 2007, Homer versa nel lago di Springfield i rifiuti tossici del silo del suo maiale domestico, causando un disastro ambientale. L'EPA isola la città sotto una cupola di vetro per contenere l'inquinamento. Il maialino, ribattezzato \"Spider-Pig\" dai fan, divenne un tormentone del film."}, {"q": "Qual è il nome anagrafico completo del personaggio noto come \"Comic Book Guy\"?", "opts": ["Gary Chalmers", "Jeff Albertson", "Lenny Leonard", "Waylon Smithers"], "ans": 1, "cat": "cinema", "expl": "Il vero nome di \"Comic Book Guy\" fu rivelato solo nel 2005, nell'episodio \"Homer and Ned's Hail Mary Pass\". Fino ad allora il personaggio era identificato esclusivamente dal suo soprannome ironico. Jeff Albertson gestisce il negozio di fumetti \"Android's Dungeon\"."}, {"q": "Qual è il nome completo dell'amico del cuore di Bart, Milhouse?", "opts": ["Milhouse Mussolini Van Houten", "Ralph Wiggum", "Nelson Muntz", "Cletus Spuckler"], "ans": 0, "cat": "cinema", "expl": "Il nome completo di Milhouse è Milhouse Mussolini Van Houten: il buffo middle name \"Mussolini\" viene svelato nell'episodio \"Sideshow Bob's Last Gleaming\" (stagione 7). Il nome \"Milhouse\" fu invece scelto da Groening in onore del presidente Richard Milhous Nixon."}, {"q": "Quale celebre fisico teorico ha prestato la voce a se stesso in diversi episodi dei Simpson?", "opts": ["Neil deGrasse Tyson", "Michio Kaku", "Stephen Hawking", "Brian Cox"], "ans": 2, "cat": "cinema", "expl": "Stephen Hawking apparve come guest star, doppiando se stesso, a partire dall'episodio \"They Saved Lisa's Brain\" del 1999. Tornò in almeno altri tre episodi negli anni successivi. Era noto per il suo senso dell'umorismo e la disponibilità a farsi ironizzare."}, {"q": "Chi fu il compositore delle musiche di scena de \"I Simpson\" per quasi tutta la durata della serie, dal 1990 al 2017?", "opts": ["Alf Clausen", "Danny Elfman", "Michael Giacchino", "Randy Newman"], "ans": 0, "cat": "cinema", "expl": "Alf Clausen compose le musiche di scena de \"I Simpson\" dal 1990 al 2017, per oltre 560 episodi. Fu licenziato nel 2017 per motivi di budget, scelta che sollevò polemiche nel fandom. Ricevette 21 nomination agli Emmy per il suo lavoro sulla serie."}, {"q": "Chi ricopre la carica di Segretario Generale della NATO dal 2024?", "opts": ["Jens Stoltenberg", "Ursula von der Leyen", "António Guterres", "Mark Rutte"], "ans": 3, "cat": "attualita", "expl": "Mark Rutte, ex primo ministro olandese, è Segretario Generale della NATO dal 1° ottobre 2024. Succede a Jens Stoltenberg dopo un mandato record di dieci anni di quest'ultimo. È il quattordicesimo Segretario Generale nella storia dell'Alleanza."}, {"q": "Quale paese ha questa bandiera?", "opts": ["Lesotho", "Eswatini", "Botswana", "Malawi"], "ans": 1, "cat": "geografia", "expl": "La bandiera dell'Eswatini, ex Swaziland, presenta uno scudo tradizionale ndzimba con lance e bastone incrociati su fasce blu-giallo-rosso. Fu adottata nel 1968, anno dell'indipendenza dal Regno Unito. Il paese cambiò nome ufficiale da Swaziland a Eswatini nel 2018.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCADVAUADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAYHAwQFAgEI/8QAURAAAQMCAgMMBwIJCgQHAAAAAQACAwQFBhESIZIHFBYXMUFRUlOT0dITIlRhcYGRFTI4QlV e romana?", "opts": ["Nefertiti", "Hatshepsut", "Cleopatra VII", "Ramses II"], "ans": 2, "cat": "storia", "expl": "Cleopatra VII fu l'ultima sovrana dell'Egitto tolemaico, morta nel 30 a.C. dopo la sconfitta contro Ottaviano. Con la sua morte l'Egitto divenne provincia romana. Parlava correntemente diverse lingue, tra cui l'egiziano, a differenza dei predecessori tolemaici."}, {"q": "Come si chiama il processo reso possibile dai batteri del genere Rhizobium, che vivono in simbiosi con le radici delle leguminose come piselli e fagioli?", "opts": ["Azotofissazione", "Fotorespirazione", "Traspirazione", "Osmoregolazione"], "ans": 0, "cat": "scienze", "expl": "I batteri Rhizobium colonizzano le radici delle leguminose formando noduli in cui avviene l'azotofissazione, la conversione dell'azoto atmosferico in ammoniaca. Questo scambio simbiotico arricchisce naturalmente il terreno di azoto. Per questo le leguminose sono spesso usate in rotazione agricola."}, {"q": "In quale disciplina olimpica si esegue il movimento noto come \"Fosbury flop\"?", "opts": ["Salto triplo", "Salto con l'asta", "Salto in lungo", "Salto in alto"], "ans": 3, "cat": "sport", "expl": "Il \"Fosbury flop\" fu introdotto da Dick Fosbury alle Olimpiadi di Città del Messico 1968, dove vinse l'oro nel salto in alto. La tecnica, con il corpo che valica l'asticella di schiena, rivoluzionò la disciplina. Oggi è lo stile usato da praticamente tutti i saltatori professionisti."}, {"q": "Quale minerale, essenziale per la sintesi degli ormoni tiroidei, è spesso aggiunto al sale da cucina come integrazione alimentare?", "opts": ["Selenio", "Iodio", "Zinco", "Magnesio"], "ans": 1, "cat": "cibo", "expl": "Lo iodio è essenziale per la sintesi degli ormoni tiroidei T3 e T4, che regolano il metabolismo. La sua carenza può causare gozzo e problemi dello sviluppo. Il sale iodato fu introdotto su larga scala nel Novecento per prevenire queste carenze diffuse."}, {"q": "Quale gruppo rock incise, nel 1965, la versione di \"I Fought the Law\" che la rese un classico rock, spesso attribuita erroneamente ai Clash che ne fecero solo una cover nel 1979?", "opts": ["The Kingsmen", "The Byrds", "The Bobby Fuller Four", "Buddy Holly and the Crickets"], "ans": 2, "cat": "musica", "expl": "The Bobby Fuller Four incisero la loro versione di \"I Fought the Law\" nel 1965, portandola nella Billboard Hot 100 l'anno successivo. Il brano era stato scritto originariamente da Sonny Curtis per i Crickets nel 1959. The Clash ne fecero una cover nel 1979, spesso scambiata per l'originale."}, {"q": "Con quale pseudonimo maschile pubblicò inizialmente Charlotte Brontë il romanzo \"Jane Eyre\"?", "opts": ["Currer Bell", "Ellis Bell", "Acton Bell", "George Eliot"], "ans": 0, "cat": "letteratura", "expl": "Charlotte Brontë pubblicò \"Jane Eyre\" nel 1847 sotto lo pseudonimo maschile Currer Bell, per essere giudicata senza pregiudizi di genere. Le sorelle Emily e Anne usarono rispettivamente Ellis e Acton Bell. L'identità reale delle tre sorelle fu rivelata solo alcuni anni dopo."}, {"q": "Chi fu il maestro del giovane Raffaello Sanzio, celebre per opere come \"Consegna delle chiavi a san Pietro\" nella Cappella Sistina?", "opts": ["Andrea del Verrocchio", "Domenico Ghirlandaio", "Filippino Lippi", "Pietro Perugino"], "ans": 3, "cat": "arte", "expl": "Raffaello si formò nella bottega di Pietro Perugino, assimilandone lo stile prima di superarlo. La \"Consegna delle chiavi a san Pietro\" nella Cappella Sistina, dipinta dal Perugino nel 1481-82, è considerata il suo capolavoro. Raffaello ne riprese la composizione in opere successive."}, {"q": "Quale inventore tedesco scomparve misteriosamente da un traghetto nel Canale della Manica nel 1913, in circostanze mai del tutto chiarite?", "opts": ["Nikolaus Otto", "Karl Benz", "Rudolf Diesel", "Gottlieb Daimler"], "ans": 2, "cat": "tecnologia", "expl": "Rudolf Diesel scomparve la notte del 29 settembre 1913 dal traghetto SS Dresden, durante una traversata verso Harwich. Il suo corpo fu ritrovato dieci giorni dopo nel Mare del Nord. Le cause restano dibattute tra suicidio per problemi finanziari e ipotesi di omicidio."}, {"q": "Quale matematico dimostrò, nel 1824, che le equazioni di quinto grado non sono risolvibili con una formula algebrica generale?", "opts": ["Évariste Galois", "Niels Henrik Abel", "Carl Friedrich Gauss", "Paolo Ruffini"], "ans": 1, "cat": "matematica", "expl": "Niels Henrik Abel dimostrò nel 1824, a proprie spese per la pubblicazione, che non esiste una formula algebrica generale per risolvere le equazioni di quinto grado. Il risultato è noto come teorema di Abel-Ruffini, poiché Ruffini ne aveva tentato una dimostrazione incompleta anni prima. Abel morì di tubercolosi a soli 26 anni."}, {"q": "Qual è il plurale corretto di \"phenomenon\" in inglese?", "opts": ["Phenomena", "Phenomenons", "Phenomenas", "Phenomenae"], "ans": 0, "cat": "inglese", "expl": "\"Phenomenon\" è una parola di origine greca e segue la regola dei plurali irregolari in \"-a\", come \"criterion/criteria\". È un errore comune usare \"phenomenons\", oggi considerato scorretto nell'inglese formale. La stessa regola vale per altre parole di origine greca come \"criterion\"."}, {"q": "Le lettere di PRESTAZIONE possono essere riordinate per formare quale delle seguenti parole?", "opts": ["Aspirazione", "Conversione", "Elettronica", "Presenziato"], "ans": 3, "cat": "anagrammi", "expl": "PRESTAZIONE e PRESENZIATO condividono le stesse undici lettere. \"Presenziato\" è il participio passato di \"presenziare\", cioè presiedere o essere presenti a un evento. Nessun'altra opzione tra quelle proposte è un anagramma valido della parola di partenza."}, {"q": "In una stanza ci sono tre interruttori: uno di essi accende una lampadina in un'altra stanza chiusa, che puoi visitare una sola volta. Come fai a scoprire con certezza quale interruttore è quello giusto?", "opts": ["Accendi tutti e tre insieme ed entra subito nella stanza, guardando quale lampadi (function() {
'use strict';
let playerName='', currentIndex=0, score=0, streak=0, maxStreak=0;

const $ = id => document.getElementById(id);
const nameOverlay=$('nameOverlay'), playerNameInput=$('playerNameInput'), startBtn=$('startBtn');

function startQuiz(){
    playerName=playerNameInput.value.trim(); if(!playerName)return;
    playerNameDisplay.textContent=playerName; nameOverlay.classList.add('hidden');
    // Start background music
    if(BGM_SRC && !bgm){

}

function showIntro(){

    introCat.textContent=catNames[q.cat]||q.cat;
    introQ.textContent=q.q;

    const bg=catBackgrounds[q.cat];
    if(bg){ introOverlay.style.backgroundImage='url('+bg+')'; introOverlay.style.background=''; introOverlay.style.backgroundSize='cover'; introOverlay.style.backgroundPosition='center'; introOverlay.style.backgroundImage='linear-gradient(rgba(15,25,35,0.3),rgba(15,25,35,0.3)),url('+bg+')'; }
    else { introOverlay.style.backgroundImage='none'; introOverlay.style.background='#0f1923'; }
    introOverlay.classList.remove('hidden');
}
introOverlay.addEventListener('click', function(){ introOverlay.classList.add('hidden'); showQuestion(); });

function showQuestion(){
    const q=questions[currentIndex];
    const hasAudio=!!q.audio;
    const timer=hasAudio?QUIZ_META.timerAudio:QUIZ_META.timerDefault;

    questionNumber.textContent='Domanda '+(currentIndex+1)+' di '+questions.length;
    questionCategory.textContent=catNames[q.cat]||q.cat;
    questionCategory.style.background=catColors[q.cat]||'#333';
    questionText.textContent=q.q;
    progressDisplay.textContent=(currentIndex+1)+' / '+questions.length;

    // Audio
    if(hasAudio){
        if(bgm) bgm.pause(); // Pause BGM during audio questions
        audioPlayer.style.display='';
        audioStarted=false;
        audioStatus.textContent='Premi ▶ per ascoltare';
        audioBar.style.width='0%';
        audioEl=new Audio(q.audio.startsWith('data:')?q.audio:'data:audio/mp3;base64,'+q.audio);
        audioEl.addEventListener('timeupdate',function(){ if(this.duration) audioBar.style.width=(this.currentTime/this.duration*100)+'%'; });
        audioEl.addEventListener('ended',function(){ audioStatus.textContent='Fine spezzone'; });
    } else {
        audioPlayer.style.display='none';
        audioEl=null;
    }

    optionsContainer.innerHTML='';
    // Question image (e.g. art questions with a painting)
    const imgContainer = document.getElementById('questionImage');
    if(q.img){
        if(!imgContainer){ const d=document.createElement('div'); d.id='questionImage'; d.style.cssText='text-align:center;margin-bottom:16px;'; questionText.after(d); }
        document.getElementById('questionImage').innerHTML='<img src="'+q.img+'" style="max-width:100%;max-height:300px;border-radius:10px;" alt="Immagine domanda">';
    } else if(imgContainer){ imgContainer.innerHTML=''; }
    // Hide credit from previous question
    const creditEl = document.getElementById('imgCredit');
    if(creditEl) creditEl.style.display='none';

    q.opts.forEach(function(opt,i){
        const btn=document.createElement('button');
        btn.className='option-btn'; btn.textContent=opt;
        btn.setAttribute('role','radio'); btn.setAttribute('aria-checked','false');
        btn.addEventListener('click',function(){ selectOption(i); });
        optionsContainer.appendChild(btn);
    });

    selectedOption=-1; answered=false; multiplierActive=false;
    confirmBtn.disabled=true; confirmBtn.style.display='';
    nextBtn.style.display='none'; contestBtn.style.display='none';
    contestArea.classList.remove('visible'); contestText.value='';
    feedbackEl.classList.remove('visible','correct-fb','wrong-fb'); feedbackEl.innerHTML='';
    var eb=document.getElementById('explanationBox');if(eb){eb.style.display='none';eb.textContent='';}
    multiplierBtn.style.display=multiplierRemaining>0?'':'none';
    multiplierBtn.classList.remove('used');

    if(hasAudio){ timerText.textContent='▶'; timerFill.style.width='100%'; timerFill.className='timer-fill'; }
    else { startTimer(timer); }
}

// Audio play
audioPlayBtn.addEventListener('click',function(){
    if(!audioEl||audioStarted) return;
    audioEl.play(); audioStarted=true; audioStatus.textContent='In riproduzione...';
    startTimer(QUIZ_META.timerAudio);
});
function startTimer(duration){
    timeLeft=duration; startTime=Date.now();
    timerFill.style.width='100%'; timerFill.className='timer-fill'; timerText.textContent=duration+'s';
    if(timerInterval) clearInterval(timerInterval);
    timerInterval=setInterval(function(){
        const elapsed=(Date.now()-startTime)/1000;
        timeLeft=Math.max(0,duration-elapsed);
        timerFill.style.width=(timeLeft/duration*100)+'%';
        timerText.textContent=Math.ceil(timeLeft)+'s';
        if(timeLeft<=5) timerFill.className='timer-fill danger';
        else if(timeLeft<=10) timerFill.className='timer-fill warning';
        else timerFill.className='timer-fill';
        if(timeLeft<=0){ clearInterval(timerInterval); timerInterval=null; handleTimeout(); }
    },100);
}
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }

function selectOption(i){ if(answered)return; selectedOption=i;
    optionsContainer.querySelectorAll('.option-btn').forEach(function(b,j){
        b.classList.toggle('selected',j===i); b.setAttribute('aria-checked',j===i?'true':'false');
    }); confirmBtn.disabled=false; }

multiplierBtn.addEventListener('click',function(){
    if(answered||multiplierRemaining<=0||multiplierActive)return;
    multiplierActive=true; multiplierRemaining--;
    multiplierBtn.classList.add('used');
    multiplierDisplay.textContent='⚡ x2 rimasti: '+multiplierRemaining+'/4';
});

confirmBtn.addEventListener('click',function(){ if(answered||selectedOption<0)return; stopTimer(); processAnswer(selectedOption); });
function handleTimeout(){ if(answered)return; processAnswer(-1); }

function getPenalty(){ if(score<0)return 25; if(score<=1000)return 75; if(score<=3000)return 150; return 300; }

function processAnswer(chosen){
    answered=true;
    const q=questions[currentIndex], correct=q.ans;
    const elapsed=(Date.now()-startTime)/1000;
    const hasAudio=!!q.audio;
    const maxTime=hasAudio?QUIZ_META.timerAudio:QUIZ_META.timerDefault;
    const timeUsed=Math.min(elapsed,maxTime);
    const isCorrect=chosen===correct, isTimeout=chosen===-1;

    optionsContainer.querySelectorAll('.option-btn').forEach(function(b,i){
        b.classList.add('disabled');
        if(i===correct) b.classList.add('correct');
        if(i===chosen&&!isCorrect) b.classList.add('wrong');
    });

    let pointsChange=0, streakBonus=0, fbText='';
    if(isCorrect){
        pointsChange=Math.max(100,Math.round(300-(timeUsed/maxTime)*200));
        if(multiplierActive) pointsChange*=2;
        streak++; if(streak>maxStreak) maxStreak=streak;
        if(streak===3) streakBonus=50; else if(streak===5) streakBonus=100; else if(streak===7) streakBonus=200;
        score+=pointsChange+streakBonus;
        fbText='✓ Corretto!<span class="points-change">+'+pointsChange+'</span>';
        if(streakBonus>0) fbText+='<span class="streak-bonus">+'+streakBonus+' streak!</span>';
        feedbackEl.className='feedback visible correct-fb';
    } else {
        let penalty=getPenalty(); if(multiplierActive) penalty=Math.round(penalty*1.5);
        pointsChange=-penalty; score+=pointsChange; streak=0;
        fbText=isTimeout?'⏱ Tempo scaduto!':'✗ Sbagliato!';
        fbText+='<span class="points-change">'+pointsChange+'</span>';
        fbText+='<br><small>Corretta: '+q.opts[correct]+'</small>';
        feedbackEl.className='feedback visible wrong-fb';
    }
    feedbackEl.innerHTML=fbText;
    scoreDisplay.textContent=score+' punti';
    streakDisplay.textContent=streak>=2?'🔥'+streak:'';
    confirmBtn.style.display='none'; multiplierBtn.style.display='none';
    nextBtn.style.display=''; contestBtn.style.display='';

    // Show Unsplash credit after answer (if present)
    if(q.credit){
        let creditEl=document.getElementById('imgCredit');
        if(!creditEl){ creditEl=document.createElement('div'); creditEl.id='imgCredit'; creditEl.style.cssText='text-align:center;font-size:0.7rem;color:#8899aa;margin-top:8px;'; const imgC=document.getElementById('questionImage'); if(imgC) imgC.after(creditEl); else questionText.after(creditEl); }
        creditEl.innerHTML='📷 Photo by <a href="'+esc(q.credit.profile)+'" target="_blank" rel="noopener" style="color:#4fc3f7">'+esc(q.credit.name)+'</a> on <a href="'+esc(q.credit.url)+'" target="_blank" rel="noopener" style="color:#4fc3f7">Unsplash</a>';
        creditEl.style.display='block';
    }

    results.push({index:currentIndex,question:q.q,category:q.cat,options:q.opts,correct,chosen,isCorrect,isTimeout,points:pointsChange,streakBonus,multiplierUsed:multiplierActive,timeUsed,contest:''});
}

contestBtn.addEventListener('click',function(){ contestArea.classList.toggle('visible'); });
saveContestBtn.addEventListener('click',function(){ const t=contestText.value.trim(); if(t&&results.length>0) results[results.length-1].contest=t; contestArea.classList.remove('visible'); });

nextBtn.addEventListener('click',function(){ if(audioEl){audioEl.pause();audioEl=null;} if(bgm&&bgm.paused) bgm.play().catch(function(){}); currentIndex++; if(currentIndex>=questions.length){ if(bgm){bgm.pause();bgm=null;} showSummary(); } else showIntro(); });
function showSummary(){
    questionCard.style.display='none'; $('scoreBar').style.display='none'; summary.classList.add('visible');
    const tot=results.length, corr=results.filter(r=>r.isCorrect).length;
    const avgT=(results.reduce((s,r)=>s+r.timeUsed,0)/tot).toFixed(1);
    summaryStats.innerHTML='<div class="stat-card"><div class="stat-value">'+score+'</div><div class="stat-label">Punteggio</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+corr+'/'+tot+'</div><div class="stat-label">Corrette</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+Math.round(corr/tot*100)+'%</div><div class="stat-label">Percentuale</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+maxStreak+'</div><div class="stat-label">Max Streak</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+avgT+'s</div><div class="stat-label">Tempo medio</div></div>';
    let html='';
    results.forEach(function(r,i){
        const sc=r.isCorrect?'correct-r':'wrong-r';
        const st=r.isCorrect?'✓ Corretto':(r.isTimeout?'⏱ Timeout':'✗ Sbagliato');
        const pts=r.points>=0?'+'+r.points:''+r.points;
        const bon=r.streakBonus>0?' (+'+r.streakBonus+' streak)':'';
        const mult=r.multiplierUsed?' [x2]':'';
        const cont=r.contest?'<div class="q-contest">📝 '+esc(r.contest)+'</div>':'';
        html+='<div class="summary-item" data-idx="'+i+'"><div class="q-head"><span class="q-num">#'+(i+1)+' - '+(catNames[r.category]||r.category)+'</span><span class="q-time">'+r.timeUsed.toFixed(1)+'s</span></div>'+
            '<div class="q-result '+sc+'">'+st+' '+pts+bon+mult+'</div>'+
            '<div class="q-explanation" id="exp-'+i+'"><strong>Domanda:</strong> '+esc(r.question)+'<br><strong>Corretta:</strong> '+esc(r.options[r.correct])+'<br>'+
            (r.chosen>=0&&!r.isCorrect?'<strong>Tua:</strong> '+esc(r.options[r.chosen])+'<br>':'')+
            '</div>'+cont+'</div>';
    });
    summaryList.innerHTML=html;
    summaryList.addEventListener('click',function(e){ const item=e.target.closest('.summary-item'); if(!item)return; const exp=$('exp-'+item.dataset.idx); if(exp) exp.classList.toggle('visible'); });
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

shareBtn.addEventListener('click',function(){
    const corr=results.filter(r=>r.isCorrect).length;
    let t='🎯 QUIZZONE — '+QUIZ_META.title+'\n👤 '+playerName+'\n🏆 '+score+' punti\n✅ '+corr+'/'+questions.length+'\n🔥 Max streak: '+maxStreak+'\n\n';
    results.forEach(function(r,i){
        const ic=r.isCorrect?'✅':(r.isTimeout?'⏱️':'❌');
        const pts=r.points>=0?'+'+r.points:''+r.points;
        const bon=r.streakBonus>0?' (+'+r.streakBonus+')':'';
        const mult=r.multiplierUsed?' [x2]':'';
        t+=ic+' #'+(i+1)+' '+(catNames[r.category]||r.category)+' — '+pts+bon+mult+' ('+r.timeUsed.toFixed(1)+'s)\n';
        if(r.contest) t+='   📝 '+r.contest+'\n';

        const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        shareMsg.classList.add('visible');setTimeout(()=>shareMsg.classList.remove('visible'),3000);
    });
});

saveFileBtn.addEventListener('click',function(){
    const corr=results.filter(r=>r.isCorrect).length;
    let t='QUIZZONE — '+QUIZ_META.title+'\nGiocatore: '+playerName+'\nPunteggio: '+score+'\nCorrette: '+corr+'/'+questions.length+'\nMax streak: '+maxStreak+'\n'+'='.repeat(50)+'\n\n';
    results.forEach(function(r,i){
        const st=r.isCorrect?'CORRETTO':(r.isTimeout?'TIMEOUT':'SBAGLIATO');
        const pts=r.points>=0?'+'+r.points:''+r.points;
        t+='#'+(i+1)+' ['+( catNames[r.category]||r.category)+'] '+st+' '+pts;
        if(r.streakBonus>0) t+=' (+'+r.streakBonus+' streak)';
        if(r.multiplierUsed) t+=' [x2]';
        t+=' ('+r.timeUsed.toFixed(1)+'s)\n  Q: '+r.question+'\n  Corretta: '+r.options[r.correct]+'\n';
        if(r.chosen>=0&&!r.isCorrect) t+='  Tua: '+r.options[r.chosen]+'\n';
        if(r.contest) t+='  CONTESTAZIONE: '+r.contest+'\n';
        t+='\n';
    });
    const blob=new Blob([t],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=QUIZ_META.filename+'_'+playerName.replace(/\s+/g,'_')+'.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
});

const KNOWN_PLAYERS=['mattia','matt','jacopo','manuel','tato','gunny','ronny'];
const uploadBtn=$('uploadBtn'),uploadMsg=$('uploadMsg');
let uploadDone=false;
function doUpload(){
  if(uploadDone)return;
  uploadBtn.disabled=true;uploadBtn.textContent='Caricamento...';
  uploadMsg.className='upload-msg';uploadMsg.textContent='';
  const corr=results.filter(r=>r.isCorrect).length;
  const avgTime=(results.reduce((s,r)=>s+r.timeUsed,0)/results.length).toFixed(1);
  const now=new Date(),ts=now.toISOString();
  const dp=now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2)+'_'+('0'+now.getHours()).slice(-2)+('0'+now.getMinutes()).slice(-2)+('0'+now.getSeconds()).slice(-2);
  const pName=playerName.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const tsCompact=now.getUTCFullYear()+('0'+(now.getUTCMonth()+1)).slice(-2)+('0'+now.getUTCDate()).slice(-2)+'T'+('0'+now.getUTCHours()).slice(-2)+('0'+now.getUTCMinutes()).slice(-2)+('0'+now.getUTCSeconds()).slice(-2)+'Z';
  const uploadId=QUIZ_META.filename+'_'+pName+'_'+tsCompact;
  const resultsArr=results.map(function(r){return{question:r.question,category:r.category,correct:r.isCorrect,timeout:r.isTimeout,points:r.points,streakBonus:r.streakBonus,multiplierUsed:r.multiplierUsed,timeUsed:parseFloat(r.timeUsed.toFixed(1)),chosenOption:r.chosen>=0?r.options[r.chosen]:null,correctOption:Array.isArray(r.correct)?r.correct.map(function(c){return r.options[c]}).join(' / '):r.options[r.correct],contest:r.contest||null}});
  const payload={quizId:QUIZ_META.filename,quizTitle:QUIZ_META.title,playerName:playerName,timestamp:ts,score:score,correct:corr,total:questions.length,percentage:Math.round(corr/questions.length*100),maxStreak:maxStreak,avgTime:parseFloat(avgTime),multiplierStats:{used:4-multiplierRemaining,remaining:multiplierRemaining},results:resultsArr};
  const filePath='stats/results/'+QUIZ_META.filename+'_'+pName+'_'+dp+'.json';
  // --- Invio 1: Worker GitHub (fonte ufficiale fino allo switch) ---
  fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filePath:filePath,payload:payload,commitMessage:'Risultati: '+playerName+' - '+QUIZ_META.title})}).then(function(r){return r.json()}).then(function(d){
    if(d.success){uploadDone=true;uploadMsg.textContent='Risultati caricati!';uploadMsg.className='upload-msg visible success';uploadBtn.textContent='Caricato';}
    else{throw new Error(d.error||'Errore')}
  }).catch(function(e){uploadMsg.textContent='Errore: '+e.message;uploadMsg.className='upload-msg visible error';uploadBtn.disabled=false;uploadBtn.textContent='Riprova';});
  // --- Invio 2: D1 (dual-write, fire-and-forget, non blocca il flusso) ---
  try{fetch(D1_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uploadId:uploadId,quizId:QUIZ_META.filename,quizTitle:QUIZ_META.title,playerName:playerName,timestamp:ts,score:score,correct:corr,total:questions.length,percentage:Math.round(corr/questions.length*100),maxStreak:maxStreak,avgTime:parseFloat(avgTime),multiplierStats:{used:4-multiplierRemaining,remaining:multiplierRemaining},results:resultsArr})}).then(function(r){return r.json()}).then(function(d){console.log('[D1 dual-write]',d)}).catch(function(e){console.warn('[D1 dual-write] fallito:',e.message)})}catch(e){console.warn('[D1 dual-write] errore:',e.message)}
}
uploadBtn.addEventListener('click',doUpload);
if(KNOWN_PLAYERS.indexOf(playerName.trim().toLowerCase())>=0){setTimeout(doUpload,500);}

})();
</script>
