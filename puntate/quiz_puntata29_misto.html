, "expl": "\"Garam\" significa \"caldo\" in urdu/hindi. La miscela tipica include cannella, cardamomo, chiodi di garofano, cumino, coriandolo e pepe nero."}, {"q": "Quale ingegnere italiano progettò nel 1924 la prima autostrada al mondo, la Milano-Laghi?", "opts": ["Pier Luigi Nervi", "Riccardo Morandi", "Piero Puricelli", "Enzo Ferrari"], "ans": 2, "cat": "tecnologia", "expl": "Piero Puricelli ideò e finanziò la Milano-Laghi (1924), considerata la prima autostrada al mondo con corsie separate e accesso controllato."}, {"q": "Chi compose la \"Sinfonia n. 9 — Dal Nuovo Mondo\", presentata a New York nel dicembre 1893?", "opts": ["Bedřich Smetana", "Gustav Mahler", "Antonín Dvořák", "Jean Sibelius"], "ans": 2, "cat": "musica", "expl": "Dvořák compose la sinfonia a New York come direttore del National Conservatory of Music, ispirandosi alla musica dei nativi americani e degli afroamericani."}, {"q": "Quale regista diresse \"Blade Runner 2049\" nel 2017 e \"Dune\" nel 2021?", "opts": ["Denis Villeneuve", "Christopher Nolan", "Alex Garland", "Ridley Scott"], "ans": 0, "cat": "cinema", "expl": "Denis Villeneuve è il regista canadese che ha diretto anche \"Arrival\" (2016), \"Sicario\" (2015) e \"Dune: Parte Due\" (2024)."}, {"q": "Quale sequenza di numeri ha la proprietà che ogni termine è la somma dei due numeri che lo precedono nella riga precedente del Triangolo di Pascal?", "opts": ["Sequenza di Fibonacci", "Numeri di Catalan", "Numeri triangolari", "Coefficienti binomiali"], "ans": 3, "cat": "matematica", "expl": "Nel Triangolo di Pascal ogni numero è la somma dei due sopra di lui. I valori sono i coefficienti binomiali C(n,k), usati nello sviluppo di (a+b)ⁿ."}, {"q": "Chi è l'autore del romanzo \"Il piacere\", pubblicato nel 1889, considerato il capolavoro dell'estetismo italiano?", "opts": ["Grazia Deledda", "Gabriele D'Annunzio", "Giovanni Verga", "Luigi Pirandello"], "ans": 1, "cat": "letteratura", "expl": "D'Annunzio scrisse \"Il piacere\" durante un soggiorno a Francavilla al Mare, ispirandosi alla vita mondana della Roma umbertina."}, {"q": "Which sentence correctly uses \"neither...nor\"?", "opts": ["Neither the teacher nor the students was ready", "Neither him nor me wants to go", "Neither the manager nor the employees were informed", "Neither of them are coming tomorrow"], "ans": 2, "cat": "inglese", "expl": "Con \"neither...nor\" il verbo concorda col soggetto più vicino: \"employees\" è plurale, quindi \"were\" è corretto."}, {"q": "In spagnolo, cosa significa l'espressione \"tener mucha cara\"?", "opts": ["Avere molta faccia tosta", "Avere un bel viso", "Essere molto costoso", "Essere molto famoso"], "ans": 0, "cat": "lingue", "expl": "\"Tener mucha cara\" (o \"ser un caradura\") significa avere sfacciataggine, comportarsi senza vergogna — equivale all'italiano \"avere faccia tosta\"."}, {"q": "Quale termine linguistico indica una parola o espressione ripetuta abitualmente nel parlato, spesso senza valore semantico, come \"cioè\" o \"tipo\"?", "opts": ["Pleonasmo", "Intercalare", "Tautologia", "Anacoluto"], "ans": 1, "cat": "lingua_italiana", "expl": "L'intercalare è una parola o espressione inserita per abitudine nel discorso, spesso come pausa (\"cioè\", \"tipo\", \"praticamente\")."}, {"q": "Quale delle seguenti frasi è un anagramma di BIAGIO ANTONACCI?", "opts": ["Cantai ogni bacio", "Notti con la magia", "Bacia il tuo canto", "Sogno antico a bit"], "ans": 0, "cat": "anagrammi", "expl": "BIAGIO ANTONACCI (15 lettere) è un anagramma perfetto di \"Cantai ogni bacio\"."}, {"q": "Quanti giocatori per squadra sono in campo contemporaneamente in una partita di pallavolo?", "opts": ["5", "6", "7", "8"], "ans": 1, "cat": "dituttounpo", "expl": "In pallavolo ogni squadra schiera 6 giocatori che ruotano le posizioni dopo ogni cambio di battuta."}, {"q": "Lo stretto di Hormuz, uno dei più trafficati al mondo per il trasporto di petrolio, si trova tra quale golfo e quale mare?", "opts": ["Golfo Persico e Mare Arabico", "Golfo di Aden e Mar Rosso", "Golfo del Bengala e Mare delle Andamane", "Golfo di Oman e Mar Caspio"], "ans": 0, "cat": "geografia", "expl": "Lo Stretto di Hormuz collega il Golfo Persico (a ovest) al Golfo di Oman e quindi al Mare Arabico (a est). Ci transita circa il 20% del petrolio mondiale."}, {"q": "In quale sport di squadra si gioca con il \"puck\"?", "opts": ["Lacrosse", "Bandy", "Polo", "Hockey su ghiaccio"], "ans": 3, "cat": "sport", "expl": "Il puck pesa circa 170 grammi ed è congelato prima delle partite per ridurne il rimbalzo."}, {"q": "Quale conferenza internazionale sul clima si è tenuta a Belém, in Brasile, nel novembre 2025?", "opts": ["G20", "COP29", "Forum di Davos", "COP30"], "ans": 3, "cat": "attualita", "expl": "La COP30 si chiuse con un accordo per triplicare i finanziamenti per l'adattamento climatico dei paesi in via di sviluppo."}, {"q": "Quale artista italo-argentino è celebre per i \"Concetti spaziali\", opere in cui squarciava la tela con un coltello?", "opts": ["Alberto Burri", "Piero Manzoni", "Lucio Fontana", "Emilio Vedova"], "ans": 2, "cat": "arte", "expl": "Fontana fondò lo Spazialismo e dal 1958 iniziò a squarciare le tele monocrome, creando i celebri \"Tagli\"."}, {"q": "Quale struttura del sistema nervoso centrale, situata nella fossa cranica posteriore, coordina i movimenti volontari e l'equilibrio?", "opts": ["Cervelletto", "Talamo", "Ipotalamo", "Midollo spinale"], "ans": 0, "cat": "scienze", "expl": "Il cervelletto contiene oltre la metà dei neuroni del cervello ed è essenziale per la coordinazione motoria fine."}, {"q": "Quale piatto tradizionale mesoamericano è costituito da un impasto di mais ripieno, avvolto in foglie di pannocchia e cotto al vapore?", "opts": ["Burrito", "Tamale", "Enchilada", "Quesadilla"], "ans": 1, "cat": "cibo", "expl": "I tamales risalgono alla civiltà mesoamericana e vengono preparati con masa farcita, avvolta nella foglia di pannocchia."}, {"q": "Quale trattato del 1713 pose fine alla guerra di successione spagnola, assegnando Gibilterra alla Gran Bretagna?", "opts": ["Trattato di Aquisgrana", "Trattato di Rastadt", "Trattato di Ryswick", "Trattato di Utrecht"], "ans": 3, "cat": "storia", "expl": "Il Trattato di Utrecht (1713) ridisegnò la mappa d'Europa e confermò la supremazia navale britannica con la cessione di Gibilterra."}, {"q": "Quale fu il primo satellite per telecomunicazioni commerciali, lanciato in orbita geostazionaria nel 1965?", "opts": ["Telstar 1", "Sputnik 2", "Intelsat I", "Explorer 1"], "ans": 2, "cat": "tecnologia", "expl": "Intelsat I, detto \"Early Bird\", fu il primo satellite geostazionario a fornire servizio commerciale regolare tra Europa e America."}, {"q": "Quale cantante e chitarrista statunitense, morto nel 1970 a 27 anni, è considerato il più grande chitarrista di tutti i tempi da Rolling Stone?", "opts": ["Jimi Hendrix", "Eric Clapton", "Jimmy Page", "B.B. King"], "ans": 0, "cat": "musica", "expl": "Hendrix rivoluzionò il modo di suonare la chitarra elettrica con tecnica e uso del feedback. Morì a Londra il 18 settembre 1970."}, {"q": "Chi è il regista italiano di \"Il Gattopardo\" e \"Morte a Venezia\"?", "opts": ["Bernardo Bertolucci", "Luchino Visconti", "Vittorio De Sica", "Roberto Rossellini"], "ans": 1, "cat": "cinema", "expl": "Visconti adattò il romanzo di Tomasi di Lampedusa nel 1963, vincendo la Palma d'Oro a Cannes."}, {"q": "Quale numero è sia quadrato perfetto sia cubo perfetto, immediatamente dopo l'1?", "opts": ["32", "36", "64", "81"], "ans": 2, "cat": "matematica", "expl": "64 = 8² = 4³. Il primo numero dopo 1 che è contemporaneamente un quadrato perfetto e un cubo perfetto (sesta potenza: 2⁶ = 64)."}, {"q": "Chi è l'autore di \"Le avventure di Tom Sawyer\" e \"Le avventure di Huckleberry Finn\"?", "opts": ["Edgar Allan Poe", "Herman Melville", "Mark Twain", "Nathaniel Hawthorne"], "ans": 2, "cat": "letteratura", "expl": "Mark Twain, pseudonimo di Samuel Clemens, pubblicò Huckleberry Finn nel 1884."}, {"q": "\ // Audio play
audioPlayBtn.addEventListener('click',function(){

function startTimer(duration){
    timeLeft=duration; startTime=Date.now();
    timerFill.style.width='100%'; timerFill.className='timer-fill'; timerText.textContent=duration+'s';
    if(timerInterval) clearInterval(timerInterval);
    timerInterval=setInterval(function(){
        const elapsed=(Date.now()-startTime)/1000;
        timeLeft=Math.max(0,duration-elapsed);
        timerFill.style.width=(timeLeft/duration*100)+'%';
        timerText.textContent=Math.ceil(timeLeft)+'s';
        if(timeLeft<=5) timerFill.className='timer-fill danger';
        else if(timeLeft<=10) timerFill.className='timer-fill warning';
        else timerFill.className='timer-fill';
        if(timeLeft<=0){ clearInterval(timerInterval); timerInterval=null; handleTimeout(); }
    },100);
}
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }

function selectOption(i){ if(answered)return; selectedOption=i;
    optionsContainer.querySelectorAll('.option-btn').forEach(function(b,j){
        b.classList.toggle('selected',j===i); b.setAttribute('aria-checked',j===i?'true':'false');
    }); confirmBtn.disabled=false; }

multiplierBtn.addEventListener('click',function(){
    if(answered||multiplierRemaining<=0||multiplierActive)return;
    multiplierActive=true; multiplierRemaining--;
    multiplierBtn.classList.add('used');
    multiplierDisplay.textContent='⚡ x2 rimasti: '+multiplierRemaining+'/4';
});

confirmBtn.addEventListener('click',function(){ if(answered||selectedOption<0)return; stopTimer(); processAnswer(selectedOption); });
function handleTimeout(){ if(answered)return; processAnswer(-1); }

function getPenalty(){ if(score<0)return 25; if(score<=1000)return 75; if(score<=3000)return 150; return 300; }

function processAnswer(chosen){
    answered=true;
    const q=questions[currentIndex], correct=q.ans;
    const elapsed=(Date.now()-startTime)/1000;
    const hasAudio=!!q.audio;
    const isRiddleQ=(q.cat==='indovinelli');const maxTime=hasAudio?QUIZ_META.timerAudio:(isRiddleQ?30:QUIZ_META.timerDefault);
    const timeUsed=Math.min(elapsed,maxTime);
    const isCorrect=chosen===correct, isTimeout=chosen===-1;

    optionsContainer.querySelectorAll('.option-btn').forEach(function(b,i){
        b.classList.add('disabled');
        if(i===correct) b.classList.add('correct');
        if(i===chosen&&!isCorrect) b.classList.add('wrong');
    });

    let pointsChange=0, streakBonus=0, fbText='';
    if(isCorrect){
        pointsChange=Math.max(100,Math.round(300-(timeUsed/maxTime)*200));
        if(multiplierActive) pointsChange*=2;
        streak++; if(streak>maxStreak) maxStreak=streak;
        if(streak===3) streakBonus=50; else if(streak===5) streakBonus=100; else if(streak===7) streakBonus=200;
        score+=pointsChange+streakBonus;
        fbText='✓ Corretto!<span class="points-change">+'+pointsChange+'</span>';
        if(streakBonus>0) fbText+='<span class="streak-bonus">+'+streakBonus+' streak!</span>';
        feedbackEl.className='feedback visible correct-fb';
    } else {
        let penalty=getPenalty(); if(multiplierActive) penalty=Math.round(penalty*1.5);
        pointsChange=-penalty; score+=pointsChange; streak=0;
        fbText=isTimeout?'⏱ Tempo scaduto!':'✗ Sbagliato!';
        fbText+='<span class="points-change">'+pointsChange+'</span>';
        fbText+='<br><small>Corretta: '+q.opts[correct]+'</small>';
        feedbackEl.className='feedback visible wrong-fb';
    }
    feedbackEl.innerHTML=fbText;
    scoreDisplay.textContent=score+' punti';
    streakDisplay.textContent=streak>=2?'🔥'+streak:'';
    confirmBtn.style.display='none'; multiplierBtn.style.display='none';
    nextBtn.style.display=''; contestBtn.style.display='';

    // Show Unsplash credit after answer (if present)
    if(q.credit){
        let creditEl=document.getElementById('imgCredit');
        if(!creditEl){ creditEl=document.createElement('div'); creditEl.id='imgCredit'; creditEl.style.cssText='text-align:center;font-size:0.7rem;color:#8899aa;margin-top:8px;'; const imgC=document.getElementById('questionImage'); if(imgC) imgC.after(creditEl); else questionText.after(creditEl); }
        creditEl.innerHTML='📷 Photo by <a href="'+esc(q.credit.profile)+'" target="_blank" rel="noopener" style="color:#4fc3f7">'+esc(q.credit.name)+'</a> on <a href="'+esc(q.credit.url)+'" target="_blank" rel="noopener" style="color:#4fc3f7">Unsplash</a>';
        creditEl.style.display='block';
    }

    results.push({index:currentIndex,question:q.q,category:q.cat,options:q.opts,correct,chosen,isCorrect,isTimeout,points:pointsChange,streakBonus,multiplierUsed:multiplierActive,timeUsed,contest:''});
}

    let html='';
    results.forEach(function(r,i){

            '</div>'+cont+'</div>';

  if(uploadDone)return;
  uploadBtn.disabled=true;uploadBtn.textContent='Caricamento...';
  uploadMsg.className='upload-msg';uploadMsg.textContent='';
  const corr=results.filter(r=>r.isCorrect).length;
  const avgTime=(results.reduce((s,r)=>s+(parseFloat(r.timeUsed)||parseFloat(r.time)||0),0)/results.length).toFixed(1);
  const now=new Date(),ts=now.toISOString();
  const dp=now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2)+'_'+('0'+now.getHours()).slice(-2)+('0'+now.getMinutes()).slice(-2)+('0'+now.getSeconds()).slice(-2);
  const pName=playerName.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const tsCompact=now.getUTCFullYear()+('0'+(now.getUTCMonth()+1)).slice(-2)+('0'+now.getUTCDate()).slice(-2)+'T'+('0'+now.getUTCHours()).slice(-2)+('0'+now.getUTCMinutes()).slice(-2)+('0'+now.getUTCSeconds()).slice(-2)+'Z';
  const uploadId=QUIZ_META.filename+'_'+pName+'_'+tsCompact;
  const resultsArr=results.map(function(r){var q=questions[r.index||r.qIdx||0]||{};var opts=r.options||q.opts||[];var corIdx=typeof r.correct!=='undefined'?r.correct:q.ans;var chIdx=r.chosen;return{question:r.question||q.q||'',category:r.category||q.cat||'',correct:r.isCorrect,timeout:r.isTimeout||(chIdx<0),points:r.points||0,streakBonus:r.streakBonus||0,multiplierUsed:r.multiplierUsed||false,timeUsed:parseFloat(r.timeUsed||r.time||0),chosenOption:chIdx>=0?opts[chIdx]:null,correctOption:Array.isArray(corIdx)?corIdx.map(function(c){return opts[c]}).join(' / '):opts[corIdx]||'',contest:r.contest||null}});
  const payload={quizId:QUIZ_META.filename,quizTitle:QUIZ_META.title,playerName:playerName,timestamp:ts,score:score,correct:corr,total:questions.length,percentage:Math.round(corr/questions.length*100),maxStreak:maxStreak,avgTime:parseFloat(avgTime),multiplierStats:{used:4-multiplierRemaining,remaining:multiplierRemaining},results:resultsArr};
  const filePath='stats/results/'+QUIZ_META.filename+'_'+pName+'_'+dp+'.json';
  // --- Invio 1: Worker GitHub ---
  fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filePath:filePath,payload:payload,commitMessage:'Risultati: '+playerName+' - '+QUIZ_META.title})}).then(function(r){return r.json()}).then(function(d){
    if(d.success){uploadDone=true;uploadMsg.textContent='Risultati caricati!';uploadMsg.className='upload-msg visible success';uploadBtn.textContent='Caricato';}
    else{throw new Error(d.error||'Errore')}
  }).catch(function(e){uploadMsg.textContent='Errore: '+e.message;uploadMsg.className='upload-msg visible error';uploadBtn.disabled=false;uploadBtn.textContent='Riprova';});
  // --- Invio 2: D1 (dual-write, fire-and-forget) ---
  try{fetch(D1_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uploadId:uploadId,quizId:QUIZ_META.filename,quizTitle:QUIZ_META.title,playerName:playerName,timestamp:ts,score:score,correct:corr,total:questions.length,percentage:Math.round(corr/questions.length*100),maxStreak:maxStreak,avgTime:parseFloat(avgTime),multiplierStats:{used:4-multiplierRemaining,remaining:multiplierRemaining},results:resultsArr})}).then(function(r){return r.json()}).then(function(d){console.log('[D1 dual-write]',d)}).catch(function(e){console.warn('[D1 dual-write] fallito:',e.message)})}catch(e){console.warn('[D1 dual-write] errore:',e.message)}
}
uploadBtn.addEventListener('click',doUpload);
if(KNOWN_PLAYERS.indexOf(playerName.trim().toLowerCase())>=0){setTimeout(doUpload,500);}

})();
</script>

(function(){
var a=new Audio("https://raw.githubusercontent.com/Kerb89/Skars-1-taking-the-finals/master/background_music/trivia_tension.mp3");a.loop=true;a.volume=0.35;var s=false;
var n=document.getElementById("nameOverlay");
new MutationObserver(function(){if(n.classList.contains("hidden")&&!s){a.play().catch(function(){});s=true}}).observe(n,{attributes:true,attributeFilter:["class"]});

window._bgAudio=a;

</script>
