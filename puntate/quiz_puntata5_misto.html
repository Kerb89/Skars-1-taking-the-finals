    function getDuration() { return quizData[currentQ].isMusic ? TIMER_MUSIC : TIMER_STD; }

    function startTimer() {
        const dur = getDuration();
        timeLeft = dur; startTime = Date.now();
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            timeLeft = Math.max(0, dur - elapsed);
            updateTimerDisplay();
            if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeout(); }
        }, 100);
    }

    function updateTimerDisplay() {
        const dur = getDuration();
        const pct = (timeLeft / dur) * 100;
        timerFill.style.width = pct + '%';
        timerText.textContent = Math.ceil(timeLeft) + 's';
        timerFill.classList.remove('warning', 'danger');
        if (timeLeft <= 5) timerFill.classList.add('danger');
        else if (timeLeft <= 10) timerFill.classList.add('warning');
    }

    function stopTimer() { clearInterval(timerInterval); }
    function getElapsed() { return (Date.now() - startTime) / 1000; }

    function calcPoints(elapsed, isCorrect) {
        const dur = getDuration();
        if (!isCorrect) {
            if (score < 0) return -25;
            if (score <= 1000) return -75;
            if (score <= 3000) return -150;
            return -300;
        }
        return Math.max(100, Math.round(300 - (elapsed / dur) * 200));
    }

    function getStreakBonus() {
        if (streak === 3) return 50;
        if (streak === 5) return 100;
        if (streak === 7) return 200;
        return 0;
    }

    function updateStreakDisplay() {
        if (streak >= 7) streakDisplay.textContent = '\ud83d\udd25\ud83d\udd25\ud83d\udd25';
        else if (streak >= 5) streakDisplay.textContent = '\ud83d\udd25\ud83d\udd25';

        else streakDisplay.textContent = '';
    }

        multiplierDisplay.textContent = '\u26a1 x2 rimasti: ' + multipliers + '/4';

    }

            document.body.style.backgroundImage = 'none';

    function handleTimeout() {

            const explHtml = !r.isCorrect ? `<div class="q-explanation" id="expl-${i}">\ud83d\udca1 ${escapeHtml(q.expl)}</div>` : '';
            const tapHint = !r.isCorrect ? ' <span style="font-size:0.7rem;color:#546e7a">\u25b8 tocca per spiegazione</span>' : '';
            listHtml += `<div class="summary-item${clickable}" ${!r.isCorrect ? `onclick="toggleExpl(${i})"` : ''}><div class="q-head"><span class="q-num">${i+1}. ${q.q}${q.q.length>55?'\u2026':''}</span><span class="q-time">${r.time.toFixed(1)}s</span></div><div class="q-result ${cls}">${icon} ${chosenLabel} | Corretta: ${labels[r.correct]} | ${r.points>0?'+':''}${r.points} pt${r.streakBonus?' +'+r.streakBonus+' streak':''}${tapHint}</div>${explHtml}${contests[r.qIdx]?'<div class="q-contest">\ud83d\udcdd '+escapeHtml(contests[r.qIdx])+'</div>':''}</div>`;
        });
        document.getElementById('summaryList').innerHTML = listHtml;
    }

    function toggleExpl(i) { const el = document.getElementById('expl-' + i); if (el) el.classList.toggle('visible'); }

    function generateShareText() {
        const correctCount = results.filter(r => r.isCorrect).length;
        const avgTime = results.reduce((s, r) => s + r.time, 0) / results.length;
        const pct = Math.round((correctCount / TOTAL_Q) * 100);
        const labels = ['A', 'B', 'C', 'D'];
        const wrongList = results.filter(r => !r.isCorrect).map(r => `  ${r.qIdx+1}. ${quizData[r.qIdx].q}\u2026 \u2192 ${r.chosen>=0?labels[r.chosen]:'tempo scaduto'} (corretta: ${labels[r.correct]})`);
        let text = `\ud83c\udfaf QUIZZONE \u2014 Puntata 5 \u2014 Misto\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\ud83d\udc64 Giocatore: ${playerName}\n\ud83c\udfc6 Punteggio: ${score} punti\n\u2705 Corrette: ${correctCount}/${TOTAL_Q} (${pct}%)\n\u23f1\ufe0f Tempo medio: ${avgTime.toFixed(1)}s\n`;
        if (wrongList.length > 0) text += `\n\u274c Errori (${wrongList.length}):\n${wrongList.join('\n')}\n`;
        const ce = Object.entries(contests);
        if (ce.length > 0) { text += `\n\ud83d\udcdd Contestazioni (${ce.length}):\n`; ce.forEach(([idx, txt]) => { text += `  D${parseInt(idx)+1}: ${txt}\n`; }); }
        text += `\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501`; return text;
    }

    function handleShare() { const t = generateShareText(); if (navigator.share) navigator.share({title:'Quizzone',text:t}).catch(()=>copyClip(t)); else copyClip(t); }
    function copyClip(t) { navigator.clipboard.writeText(t).then(()=>{const m=document.getElementById('shareMsg');m.classList.add('visible');setTimeout(()=>m.classList.remove('visible'),3000);}).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);const m=document.getElementById('shareMsg');m.classList.add('visible');setTimeout(()=>m.classList.remove('visible'),3000);}); }
    function handleSaveFile() { const t = generateShareText(); const blob = new Blob([t],{type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='quizzone_puntata5_risultati.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
    function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

    confirmBtn.addEventListener('click', handleConfirm);
    nextBtn.addEventListener('click', handleNext);
    contestBtn.addEventListener('click', handleContest);
    saveContestBtn.addEventListener('click', saveContest);
    document.getElementById('shareBtn').addEventListener('click', handleShare);
    document.getElementById('saveBtn').addEventListener('click', handleSaveFile);

    document.addEventListener('keydown', (e) => {
        if (nameOverlay && !nameOverlay.classList.contains('hidden')) return;
        if (e.key === 'Enter' && !confirmed && selectedOpt >= 0) handleConfirm();
        else if (e.key === 'Enter' && confirmed) handleNext();
        else if (!confirmed) { const km = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}; const idx=km[e.key.toLowerCase()]; if(idx!==undefined) selectOption(idx); }
    });
// UPLOAD RISULTATI VIA CLOUDFLARE WORKER
const QUIZ_META={title:'Puntata 5 â€” Misto',filename:'quiz_puntata5_misto',timerDefault:20,timerAudio:30};
const questions=quizData;
const maxStreak=typeof streak!=='undefined'?streak:0;
// ============================================================
// UPLOAD RISULTATI VIA CLOUDFLARE WORKER + D1 (dual-write)
const WORKER_URL='https://quiz-results.kerberozzo89.workers.dev';
const D1_URL='https://skars-1.pages.dev/api/results';
const KNOWN_PLAYERS=['mattia','matt','jacopo','manuel','tato','gunny','ronny'];
const uploadBtn=$('uploadBtn'),uploadMsg=$('uploadMsg');
let uploadDone=false;
function doUpload(){
  if(uploadDone)return;
  uploadBtn.disabled=true;uploadBtn.textContent='Caricamento...';
  uploadMsg.className='upload-msg';uploadMsg.textContent='';
  const corr=results.filter(r=>r.isCorrect).length;
  const avgTime=(results.reduce((s,r)=>s+(parseFloat(r.timeUsed)||parseFloat(r.time)||0),0)/results.length).toFixed(1);
  const now=new Date(),ts=now.toISOString();
  const dp=now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2)+'_'+('0'+now.getHours()).slice(-2)+('0'+now.getMinutes()).slice(-2)+('0'+now.getSeconds()).slice(-2);
  const pName=playerName.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const tsCompact=now.getUTCFullYear()+('0'+(now.getUTCMonth()+1)).slice(-2)+('0'+now.getUTCDate()).slice(-2)+'T'+('0'+now.getUTCHours()).slice(-2)+('0'+now.getUTCMinutes()).slice(-2)+('0'+now.getUTCSeconds()).slice(-2)+'Z';
  const uploadId=QUIZ_META.filename+'_'+pName+'_'+tsCompact;
  const resultsArr=results.map(function(r){var q=questions[r.index||r.qIdx||0]||{};var opts=r.options||q.opts||[];var corIdx=typeof r.correct!=='undefined'?r.correct:q.ans;var chIdx=r.chosen;return{question:r.question||q.q||'',category:r.category||q.cat||'',correct:r.isCorrect,timeout:r.isTimeout||(chIdx<0),points:r.points||0,streakBonus:r.streakBonus||0,multiplierUsed:r.multiplierUsed||false,timeUsed:parseFloat(r.timeUsed||r.time||0),chosenOption:chIdx>=0?opts[chIdx]:null,correctOption:Array.isArray(corIdx)?corIdx.map(function(c){return opts[c]}).join(' / '):opts[corIdx]||'',contest:r.contest||null}});
  const payload={quizId:QUIZ_META.filename,quizTitle:QUIZ_META.title,playerName:playerName,timestamp:ts,score:score,correct:corr,total:questions.length,percentage:Math.round(corr/questions.length*100),maxStreak:maxStreak,avgTime:parseFloat(avgTime),multiplierStats:{used:4-multiplierRemaining,remaining:multiplierRemaining},results:resultsArr};
  const filePath='stats/results/'+QUIZ_META.filename+'_'+pName+'_'+dp+'.json';
  // --- Invio 1: Worker GitHub ---
  fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filePath:filePath,payload:payload,commitMessage:'Risultati: '+playerName+' - '+QUIZ_META.title})}).then(function(r){return r.json()}).then(function(d){
    if(d.success){uploadDone=true;uploadMsg.textContent='Risultati caricati!';uploadMsg.className='upload-msg visible success';uploadBtn.textContent='Caricato';}
    else{throw new Error(d.error||'Errore')}
  }).catch(function(e){uploadMsg.textContent='Errore: '+e.message;uploadMsg.className='upload-msg visible error';uploadBtn.disabled=false;uploadBtn.textContent='Riprova';});
  // --- Invio 2: D1 (dual-write, fire-and-forget) ---
  try{fetch(D1_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uploadId:uploadId,quizId:QUIZ_META.filename,quizTitle:QUIZ_META.title,playerName:playerName,timestamp:ts,score:score,correct:corr,total:questions.length,percentage:Math.round(corr/questions.length*100),maxStreak:maxStreak,avgTime:parseFloat(avgTime),multiplierStats:{used:4-multiplierRemaining,remaining:multiplierRemaining},results:resultsArr})}).then(function(r){return r.json()}).then(function(d){console.log('[D1 dual-write]',d)}).catch(function(e){console.warn('[D1 dual-write] fallito:',e.message)})}catch(e){console.warn('[D1 dual-write] errore:',e.message)}
}
uploadBtn.addEventListener('click',doUpload);
if(KNOWN_PLAYERS.indexOf(playerName.trim().toLowerCase())>=0){setTimeout(doUpload,500);}
