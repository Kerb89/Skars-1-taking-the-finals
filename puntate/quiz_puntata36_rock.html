const questions = [{"q":"Qual è la capitale dello Sri Lanka?","opts":["Kotte","Anuradhapura","Polonnaruwa","Trincomalee"],"ans":0,"cat":"geografia","expl":"Sri Jayawardenepura Kotte è la capitale amministrativa e legislativa ufficiale dello Sri Lanka dal 1982, mentre Colombo resta la capitale commerciale ed esecutiva de facto. Anuradhapura e Polonnaruwa furono invece antiche capitali storiche del regno singalese, oggi siti archeologici."},{"q":"In che anno fu inaugurata la Stockton and Darlington Railway, la prima ferrovia pubblica al mondo trainata da locomotive a vapore?","opts":["1804","1825","1830","1850"],"ans":1,"cat":"tecnologia","expl":"La Stockton and Darlington Railway fu inaugurata il 27 settembre 1825, prima ferrovia pubblica al mondo trainata da locomotive a vapore. Segnò l'inizio dell'era ferroviaria commerciale, precedendo di alcuni anni la più nota Liverpool and Manchester Railway del 1830."},{"q":"Chi propose per primo, nel 1931, la teoria che l'universo ebbe origine da un \"atomo primordiale\", antesignana del Big Bang?","opts":["Edwin Hubble","Fred Hoyle","Georges Lemaître","Albert Einstein"],"ans":2,"cat":"scienze","expl":"Il fisico e sacerdote belga Georges Lemaître formulò nel 1931 l'ipotesi dell'\"atomo primordiale\", antesignana della moderna teoria del Big Bang. Nel 1927 aveva già proposto l'espansione dell'universo, ma l'idea di un'origine puntiforme arrivò solo quattro anni dopo."},{"q":"In quali Giochi Olimpici il salto con l'asta femminile fece il suo debutto nel programma olimpico?","opts":["Atlanta 1996","Atene 2004","Pechino 2008","Sydney 2000"],"ans":3,"cat":"sport","expl":"Il salto con l'asta femminile debuttò nel programma olimpico ai Giochi di Sydney 2000, con la vittoria dell'americana Stacy Dragila. Fino ad allora la disciplina era riservata ai soli uomini nelle Olimpiadi."},{"q":"Quale sovrano inglese ruppe con la Chiesa di Roma nel 1534, fondando la Chiesa anglicana?","opts":["Riccardo III","Enrico VIII","Enrico VII","Edoardo VI"],"ans":1,"cat":"storia","expl":"Con l'Atto di Supremazia del 1534, Enrico VIII ruppe con la Chiesa di Roma e si proclamò capo supremo della Chiesa d'Inghilterra. La rottura nacque dal rifiuto papale di annullargli il matrimonio con Caterina d'Aragona."},{"q":"Quale alfa-idrossiacido, estratto dalla canna da zucchero, è largamente usato nei prodotti cosmetici esfolianti per il suo potere di rinnovamento cellulare?","opts":["Acido glicolico","Acido salicilico","Acido ialuronico","Acido lattico"],"ans":0,"cat":"cibo","expl":"L'acido glicolico è un alfa-idrossiacido ricavato dalla canna da zucchero, ampiamente usato nei cosmetici esfolianti per la sua capacità di rinnovare la superficie cutanea. È tra gli AHA più diffusi in dermocosmesi insieme all'acido lattico."},{"q":"Quale film vinse il primo Oscar della storia come Miglior Film, nel 1929?","opts":["Sunrise","The Jazz Singer","Wings","The Broadway Melody"],"ans":2,"cat":"cinema","expl":"\"Wings\" vinse il premio per l'Outstanding Picture alla prima cerimonia degli Academy Awards, il 16 maggio 1929, considerato il primo Oscar al Miglior Film della storia. Era un film muto ambientato durante la Prima guerra mondiale."},{"q":"Quale spiritello dispettoso, servitore di Oberon, provoca equivoci amorosi nel \"Sogno di una notte di mezza estate\" di Shakespeare?","opts":["Ariel","Titania","Bottom","Puck"],"ans":3,"cat":"letteratura","expl":"Puck, noto anche come Robin Goodfellow, è lo spiritello dispettoso al servizio di Oberon nel \"Sogno di una notte di mezza estate\" di Shakespeare. È lui a creare gli equivoci amorosi versando il succo di un fiore magico sugli occhi degli innamorati."},{"q":"In quale città italiana, tra il 1915 e il 1917, Giorgio de Chirico e Carlo Carrà diedero forma compiuta al movimento della Pittura Metafisica?","opts":["Ferrara","Torino","Firenze","Bologna"],"ans":0,"cat":"arte","expl":"Fu a Ferrara, tra il 1915 e il 1917, che Giorgio de Chirico e Carlo Carrà, entrambi di stanza in città durante la guerra, diedero forma compiuta al movimento della Pittura Metafisica. Le prime opere isolate di de Chirico risalgono in realtà al 1910 a Firenze."},{"q":"Come si chiama la figura retorica che consiste nell'esagerare volutamente un concetto per enfatizzarlo, come in \"te l'ho ripetuto un milione di volte\"?","opts":["Litote","Iperbole","Metonimia","Anafora"],"ans":1,"cat":"lingua_italiana","expl":"L'iperbole è la figura retorica che esagera volutamente un concetto per enfatizzarlo, come in \"te l'ho ripetuto un milione di volte\". È tra le figure retoriche più usate nel linguaggio quotidiano, spesso senza che ce ne accorgiamo."},{"q":"Come si dice in inglese l'espressione idiomatica \"prendere due piccioni con una fava\"?","opts":["To be one in a million","To put two and two together","To have one foot in the grave","To kill two birds with one stone"],"ans":3,"cat":"inglese","expl":"\"To kill two birds with one stone\" è l'equivalente inglese standard di \"prendere due piccioni con una fava\", entrambi riferiti a ottenere due risultati con una sola azione. È uno degli idiomi più noti e insegnati nei corsi di inglese."},{"q":"Quale parola è l'anagramma di CARTOLINE?","opts":["Caminetto","Cantonata","Cialtrone","Cartolaio"],"ans":2,"cat":"anagrammi","expl":"CIALTRONE è l'anagramma di CARTOLINE, condividendo esattamente le stesse nove lettere. Gli altri termini proposti, pur plausibili come parole italiane, non condividono lo stesso insieme di lettere."},{"q":"Quale famoso gioco per bambini, un composto siliconico elastico e rimbalzante, nacque per errore nel 1943 durante un tentativo di creare un sostituto sintetico della gomma?","opts":["Play-Doh","Silly Putty","Slime","Super Ball"],"ans":1,"cat":"dituttounpo","expl":"Il Silly Putty nacque per errore nel 1943, quando il chimico James Wright, impegnato in ricerche belliche per un sostituto sintetico della gomma, ottenne per caso questo composto siliconico elastico e rimbalzante. Diventò un giocattolo di culto solo alcuni anni dopo."},{"q":"Chi ricopre attualmente la carica di Segretario Generale delle Nazioni Unite?","opts":["António Guterres","Ban Ki-moon","Kofi Annan","Mark Rutte"],"ans":0,"cat":"attualita","expl":"António Guterres, ex primo ministro portoghese, ricopre la carica di Segretario Generale delle Nazioni Unite. Mark Rutte, spesso confuso con lui nei quiz, è invece il Segretario Generale della NATO."},{"q":"Scomponendo il numero 555 in due numeri e sommandoli tra loro, quale valore si ottiene sempre?","opts":["65","105","150","60"],"ans":3,"cat":"dituttounpo","expl":"Scomponendo la sequenza di tre cifre \"5\" del numero 555 in due numeri distinti — 55 e 5, oppure 5 e 55 — la loro somma è sempre 60. È un classico rompicapo che sfrutta la posizione delle cifre anziché il valore dei numeri."},{"q":"Quale di questi artisti NON è mai stato il cantante degli AC/DC in nessun momento della storia della band?","opts":["Dave Evans","Brian Johnson","Bon Scott","Alice Cooper"],"ans":3,"cat":"musica","expl":"Alice Cooper non ha mai cantato per gli AC/DC. Dave Evans fu il primissimo cantante della band (1973-74), Bon Scott il frontman storico fino al 1980, e Brian Johnson il suo successore diretto da allora.","img":"data:image/webp;base64,UklGRgQoAABXRUJQVlA4IPgnAACQLwGdASogAxUCPsFgqVCnpTm1InL5MzAYCWVu+CbNs9R/nuSNr55ml3bLc48v7knzMkW5RXcueX8B3rPS1+t9+B52POe84/flN6cyGuSLutWBmSC6t8o9BX+S/7TJ5s1+8Ao5M4TfZqICJIZeNtRSqY21FKpjbUUqmPfm2qDUUpNDcEkyQy8bailUxtqKVTG2phSGXjfDQCEMunw/loW+Zx1pVMbailUxtqKVTG5NopasSXMJPZgrDKF1nswCSZIZeNtRSqY21h6DWAQSVmujuNT7rTpWL/Qy8bai/fSqY2jepcztFW1pFFoArOKze+NP0s0EEkyb4CSZs6g6oALAaVbWhvSgRbk3L27rWZWbaoNZR/j0ECsdo6M2LuhNiqcDeM00t/O4vTeSKsznjgBLAIhOnTAhNCEyOAL1XWekbBXy5WmFtaEVtvvacjZ5wlBrFCY3KDN1y/4yWWvo/KnhFRPXKvy8Ok7wI+hBdU4avG9JsJm0BIaW2iLmHKlm5E8oyRtpP0SRWso2ordhtkvFLMfpUfG2qKG6MD99hZQj1P38EhE92n0kQWKkZ+JvUa9kSDjPYYLERMtOZl21wOcOE0krzYMqX0Y0Wo8SjSYGavhxot8RsGAqNycdLzjFk21FKvVfyaP+5Fi54u6Ig9icCe+ejh/qDIviyv3653awdsWS7VglnI3KaRySUVdVvLUcuEPAMTl5X02OScOFJEpx iffel","Vladimir Shukhov","Alexandre-Gustave Bartholdi"],"ans":1,"cat":"tecnologia","expl":"La Torre Eiffel, costruita per l'Esposizione Universale di Parigi del 1889, è attribuita a Gustave Eiffel, sebbene il progetto tecnico fosse stato sviluppato dai suoi ingegneri Maurice Koechlin ed Émile Nouguier all'interno della sua azienda. Doveva essere una struttura temporanea, ma divenne il simbolo permanente della città."},{"q":"Quale scienziato americano, insieme a un collega britannico, propose nel 1953 il modello della doppia elica del DNA basandosi anche sui dati di diffrazione a raggi X ottenuti da Rosalind Franklin?","opts":["James Watson","Linus Pauling","George Beadle","Erwin Chargaff"],"ans":0,"cat":"scienze","expl":"L'americano James Watson, insieme al britannico Francis Crick, propose nel 1953 il modello a doppia elica del DNA, basandosi anche sui dati di diffrazione a raggi X ottenuti da Rosalind Franklin. La scoperta valse a Watson, Crick e Maurice Wilkins il premio Nobel nel 1962."},{"q":"Quale tennista fu il primo, nel 1969, a vincere tutti e quattro i tornei del Grande Slam nello stesso anno solare nell'era Open?","opts":["Roy Emerson","Ken Rosewall","Rod Laver","John Newcombe"],"ans":2,"cat":"sport","expl":"L'australiano Rod Laver vinse nel 1969 tutti e quattro i tornei del Grande Slam nello stesso anno solare, primo e finora unico uomo a riuscirci nell'era Open del tennis. Aveva già compiuto l'impresa nel 1962, ma allora il circuito non era ancora aperto ai professionisti."},{"q":"Quale imperatrice russa, salita al trono nel 1762 dopo un colpo di stato contro il marito Pietro III, è passata alla storia come \"la Grande\"?","opts":["Caterina II","Elisabetta di Russia","Anna Ioannovna","Caterina I"],"ans":0,"cat":"storia","expl":"Caterina II salì al trono di Russia nel luglio 1762 dopo un colpo di stato militare contro il marito Pietro III, che fu deposto e poco dopo ucciso. Passata alla storia come \"Caterina la Grande\", governò per oltre trent'anni espandendo notevolmente i confini dell'impero."},{"q":"Quale bacca essiccata conferisce il caratteristico aroma resinoso a un noto distillato inglese, alla base del celebre cocktail abbinato all'acqua tonica?","opts":["Bacche di sorbo","Bacche di ginepro","Bacche di rosa canina","Bacche di sambuco"],"ans":1,"cat":"cibo","expl":"Le bacche di ginepro essiccate conferiscono al gin il suo caratteristico aroma resinoso, ed è proprio la loro presenza obbligatoria a definire legalmente questo distillato. Il gin è alla base del celebre Gin Tonic, nato originariamente come rimedio contro la malaria nelle colonie britanniche."},{"q":"Quale film del 1941, diretto e interpretato da Orson Welles, è considerato uno dei capolavori della storia del cinema?","opts":["La Signora di Shanghai","L'Orgoglio degli Amberson","L'Infernale Quinlan","Quarto Potere"],"ans":3,"cat":"cinema","expl":"\"Quarto Potere\" (Citizen Kane), diretto, prodotto e interpretato da Orson Welles nel 1941, è considerato uno dei capolavori assoluti della storia del cinema per le sue innovazioni narrative e tecniche. Gli altri titoli proposti sono anch'essi film di Welles, ma di anni successivi."},{"q":"Quale romanzo di Jane Austen, pubblicato anonimamente nel 1813, si apre con la celebre frase sulla \"verità universalmente riconosciuta\" che un uomo ricco necessiti di moglie?","opts":["Ragione e Sentimento","Emma","Orgoglio e Pregiudizio","Persuasione"],"ans":2,"cat":"letteratura","expl":"\"Orgoglio e Pregiudizio\", pubblicato anonimamente da Jane Austen nel 1813, si apre con la celebre frase \"è una verità universalmente riconosciuta che uno scapolo in possesso di un'ingente fortuna debba essere in cerca di una moglie\". È tra i romanzi più letti e adattati della letteratura inglese."},{"q":"Su commissione di quale papa Michelangelo affrescò la volta della Cappella Sistina, tra il 1508 e il 1512?","opts":["Giulio II","Leone X","Alessandro VI","Sisto IV"],"ans":0,"cat":"arte","expl":"Papa Giulio II commissionò a Michelangelo l'affresco della volta della Cappella Sistina, realizzato tra il 1508 e il 1512. Il pontefice, noto per il suo carattere impaziente, seguì da vicino e con insistenza l'avanzamento dei lavori."},{"q":"Qual è la forma corretta del congiuntivo imperfetto del verbo \"porre\" alla terza persona singolare?","opts":["Ponga","Porrebbe","Pose","Ponesse"],"ans":3,"cat":"lingua_italiana","expl":"\"Ponesse\" è la corretta terza persona singolare del congiuntivo imperfetto del verbo \"porre\" (che ponesse). Le altre opzioni corrispondono ad altri modi e tempi verbali dello stesso verbo."},{"q":"Come si dice in inglese il modo di dire italiano \"avere le mani in pasta\", riferito a chi è coinvolto in molti affari o attività diverse?","opts":["To have a chip on your shoulder","To beat around the bush","To have a finger in every pie","To let the cat out of the bag"],"ans":2,"cat":"inglese","expl":"\"To have a finger in every pie\" è l'equivalente idiomatico inglese di \"avere le mani in pasta\", entrambi riferiti a chi è coinvolto in molteplici affari o attività. È un'espressione comune nei dizionari idiomatici italiano-inglese."},{"q":"Quale parola è l'anagramma di CALDERONE?","opts":["Calzolaio","Cavalcata","Canovacci","Canederlo"],"ans":3,"cat":"anagrammi","expl":"CANEDERLO è l'anagramma di CALDERONE, condividendo esattamente le stesse nove lettere. Il canederlo è peraltro una vera specialità gastronomica del Trentino-Alto Adige, un curioso collegamento culinario casuale con la parola di partenza."},{"q":"Come si chiama il fenomeno percettivo per cui il cervello umano tende a riconoscere volti o figure familiari in oggetti inanimati o pattern casuali, come nuvole o prese elettriche?","opts":["Sinestesia","Apofenia","Pareidolia","Deja-vu"],"ans":2,"cat":"dituttounpo","expl":"La pareidolia è il fenomeno percettivo specifico per cui il cervello riconosce volti o figure familiari in immagini o pattern casuali, come nuvole o prese elettriche. È considerata un caso particolare del fenomeno più generale dell'apofenia, che riguarda il riconoscimento di pattern significativi anche non visivi."},{"q":"Quale matematico francese, morto in duello a soli 20 anni nel 1832, gettò comunque le basi della moderna teoria dei gruppi?","opts":["Évariste Galois","Niels Henrik Abel","Augustin-Louis Cauchy","Joseph-Louis Lagrange"],"ans":0,"cat":"matematica","expl":"Il matematico francese Évariste Galois morì in un duello nel 1832, a soli 20 anni, dopo aver gettato nella notte precedente le basi scritte della moderna teoria dei gruppi. I suoi manoscritti furono compresi e valorizzati appieno solo decenni dopo la sua morte."},{"q":"Cosa significa in tedesco il termine \"Waldeinsamkeit\"?","opts":["La sensazione di pace e solitudine contemplativa provata quando ci si trova soli in un bosco","Il timore di rimanere senza copertura di rete durante una lunga escursione in montagna","Il piacere sottile di dormire una notte all'aperto sotto le stelle in piena estate","Il fastidio provocato dal fruscio continuo del vento tra le foglie degli alberi"],"ans":0,"cat":"lingue","expl":"\"Waldeinsamkeit\" è un termine tedesco intraducibile con una sola parola, che descrive la sensazione di pace, solitudine e connessione con la natura provata stando soli in un bosco. Il concetto ha radici nel Romanticismo tedesco del XIX secolo."}];

const catBackgrounds = {"geografia": "/assets/backgrounds/geografia_0.webp", "tecnologia": "/assets/backgrounds/tecnologia_0.webp", "scienze": "/assets/backgrounds/scienze_0.webp", "sport": "/assets/backgrounds/sport_0.webp", "storia": "/assets/backgrounds/storia_0.webp", "cibo": "/assets/backgrounds/cibo_2.webp", "musica": "/assets/backgrounds/musica_0.webp", "letteratura": "/assets/backgrounds/letteratura_2.webp", "inglese": "/assets/backgrounds/inglese_0.webp", "lingua_italiana": "/assets/backgrounds/lingua_italiana_0.webp", "anagrammi": "/assets/backgrounds/anagrammi_0.webp", "matematica": "/assets/backgrounds/matematica_1.webp", "lingue": "/assets/backgrounds/lingue_0.webp", "cinema": "/assets/backgrounds/cinema_0.webp", "attualita": "/assets/backgrounds/attualita_0.webp", "dituttounpo": "/assets/backgrounds/dituttounpo_0.webp"};
// Formato: {"geografia":"/assets/backgrounds/geografia_0.webp", ...}

// Musica di background (file esterno, servito dal CDN)
const BGM_SRC = "/assets/bgm.mp3";
// ============================================================

const catColors = {
    geografia:"#1a3a5c", tecnologia:"#0d3b2e", scienze:"#1b4d5c",
    sport:"#5c2a0d", storia:"#4a3b1f", cibo:"#5c1a1a",
    attualita:"#2a3545", matematica:"#1a2a1a", musica:"#3d1a4a",
    cinema:"#3d0d0d", letteratura:"#3d2a1a", arte:"#2a2a4a",
    inglese:"#1a1a4a", lingue:"#4a3a1a", anagrammi:"#2a3d1a",
    dituttounpo:"#2a1a3d", lingua_italiana:"#1a3a5c"
};
const catNames = {
    geografia:"Geografia", tecnologia:"Tecnologia", scienze:"Scienze",
    sport:"Sport", storia:"Storia", cibo:"Cibo e benessere",
    attualita:"Attualità", matematica:"Matematica", musica:"Musica",
    cinema:"Cinema", letteratura:"Letteratura", arte:"Arte",
    inglese:"Inglese", lingue:"Lingue straniere", anagrammi:"Anagrammi",
    dituttounpo:"Di tutto un po'", lingua_italiana:"Lingua italiana"
};

(function() {
'use strict';
let playerName='', currentIndex=0, score=0, streak=0, maxStreak=0;
let multiplierRemaining=4, multiplierActive=false, selectedOption=-1, answered=false;
let timerInterval=null, timeLeft=20, startTime=0, results=[];
let audioEl=null, audioStarted=false;
let bgm=null;

const $ = id => document.getElementById(id);
const nameOverlay=$('nameOverlay'), playerNameInput=$('playerNameInput'), startBtn=$('startBtn');
const playerNameDisplay=$('playerNameDisplay'), introOverlay=$('introOverlay');
const introCat=$('introCat'), introQ=$('introQ');
const scoreDisplay=$('scoreDisplay'), streakDisplay=$('streakDisplay');
const multiplierDisplay=$('multiplierDisplay'), timerFill=$('timerFill'), timerText=$('timerText');
const progressDisplay=$('progressDisplay'), questionCard=$('questionCard');
const questionNumber=$('questionNumber'), questionCategory=$('questionCategory');
const questionText=$('questionText'), optionsContainer=$('optionsContainer');
const feedbackEl=$('feedback'), confirmBtn=$('confirmBtn'), multiplierBtn=$('multiplierBtn');
const contestBtn=$('contestBtn'), contestArea=$('contestArea');
const contestText=$('contestText'), saveContestBtn=$('saveContestBtn');
const nextBtn=$('nextBtn'), summary=$('summary');
const summaryStats=$('summaryStats'), summaryList=$('summaryList');
const shareBtn=$('shareBtn'), saveFileBtn=$('saveBtn'), shareMsg=$('shareMsg');
const audioPlayer=$('audioPlayer'), audioPlayBtn=$('audioPlayBtn');
const audioBar=$('audioBar'), audioStatus=$('audioStatus');

playerNameInput.addEventListener('input', function(){ startBtn.disabled = this.value.trim().length===0; });
playerNameInput.addEventListener('keydown', function(e){ if(e.key==='Enter'&&this.value.trim()) startQuiz(); });
startBtn.addEventListener('click', startQuiz);

function startQuiz(){
    playerName=playerNameInput.value.trim(); if(!playerName)return;
    playerNameDisplay.textContent=playerName; nameOverlay.classList.add('hidden');
    // Start background music
    if(BGM_SRC && !bgm){
        bgm=new Audio(BGM_SRC); bgm.loop=true; bgm.volume=0.3;
        bgm.play().catch(function(){});
    }
    showIntro();
}

function showIntro(){
    const q=questions[currentIndex];
    introCat.textContent=catNames[q.cat]||q.cat;
    introQ.textContent=q.q;
    // Set category background
    const bg=catBackgrounds[q.cat];
    if(bg){ introOverlay.style.backgroundImage='url('+bg+')'; introOverlay.style.background=''; introOverlay.style.backgroundSize='cover'; introOverlay.style.backgroundPosition='center'; introOverlay.style.backgroundImage='linear-gradient(rgba(15,25,35,0.3),rgba(15,25,35,0.3)),url('+bg+')'; }
    else { introOverlay.style.backgroundImage='none'; introOverlay.style.background='#0f1923'; }
    introOverlay.classList.remove('hidden');
}
introOverlay.addEventListener('click', function(){ introOverlay.classList.add('hidden'); showQuestion(); });

function showQuestion(){
    const q=questions[currentIndex];
    const hasAudio=!!q.audio;
    const timer=hasAudio?QUIZ_META.timerAudio:QUIZ_META.timerDefault;

    questionNumber.textContent='Domanda '+(currentIndex+1)+' di '+questions.length;
    questionCategory.textContent=catNames[q.cat]||q.cat;
    questionCategory.style.background=catColors[q.cat]||'#333';
    questionText.textContent=q.q;
    progressDisplay.textContent=(currentIndex+1)+' / '+questions.length;

    // Audio
    if(hasAudio){
        if(bgm) bgm.pause(); // Pause BGM during audio questions
        audioPlayer.style.display='';
        audioStarted=false;
        audioStatus.textContent='Premi ▶ per ascoltare';
        audioBar.style.width='0%';
        audioEl=new Audio(q.audio.startsWith('data:')?q.audio:'data:audio/mp3;base64,'+q.audio);
        audioEl.addEventListener('timeupdate',function(){ if(this.duration) audioBar.style.width=(this.currentTime/this.duration*100)+'%'; });
        audioEl.addEventListener('ended',function(){ audioStatus.textContent='Fine spezzone'; });
    } else {
        audioPlayer.style.display='none';
        audioEl=null;
    }

    optionsContainer.innerHTML='';
    // Question image (e.g. art questions with a painting)
    const imgContainer = document.getElementById('questionImage');
    if(q.img){
        if(!imgContainer){ const d=document.createElement('div'); d.id='questionImage'; d.style.cssText='text-align:center;margin-bottom:16px;'; questionText.after(d); }
        document.getElementById('questionImage').innerHTML='<img src="'+q.img+'" style="max-width:100%;max-height:300px;border-radius:10px;" alt="Immagine domanda">';
    } else if(imgContainer){ imgContainer.innerHTML=''; }
    // Hide credit from previous question
    const creditEl = document.getElementById('imgCredit');
    if(creditEl) creditEl.style.display='none';

    q.opts.forEach(function(opt,i){
        const btn=document.createElement('button');
        btn.className='option-btn'; btn.textContent=opt;
        btn.setAttribute('role','radio'); btn.setAttribute('aria-checked','false');
        btn.addEventListener('click',function(){ selectOption(i); });
        optionsContainer.appendChild(btn);
    });

    selectedOption=-1; answered=false; multiplierActive=false;
    confirmBtn.disabled=true; confirmBtn.style.display='';
    nextBtn.style.display='none'; contestBtn.style.display='none';
    contestArea.classList.remove('visible'); contestText.value='';
    feedbackEl.classList.remove('visible','correct-fb','wrong-fb'); feedbackEl.innerHTML='';
    var eb=document.getElementById('explanationBox');if(eb){eb.style.display='none';eb.textContent='';}
    multiplierBtn.style.display=multiplierRemaining>0?'':'none';
    multiplierBtn.classList.remove('used');

    if(hasAudio){ timerText.textContent='▶'; timerFill.style.width='100%'; timerFill.className='timer-fill'; }
    else { startTimer(timer); }
}

// Audio play
audioPlayBtn.addEventListener('click',function(){
    if(!audioEl||audioStarted) return;
    audioEl.play(); audioStarted=true; audioStatus.textContent='In riproduzione...';
    startTimer(QUIZ_META.timerAudio);
});
function startTimer(duration){
    timeLeft=duration; startTime=Date.now();
    timerFill.style.width='100%'; timerFill.className='timer-fill'; timerText.textContent=duration+'s';
    if(timerInterval) clearInterval(timerInterval);
    timerInterval=setInterval(function(){
        const elapsed=(Date.now()-startTime)/1000;
        timeLeft=Math.max(0,duration-elapsed);
        timerFill.style.width=(timeLeft/duration*100)+'%';
        timerText.textContent=Math.ceil(timeLeft)+'s';
        if(timeLeft<=5) timerFill.className='timer-fill danger';
        else if(timeLeft<=10) timerFill.className='timer-fill warning';
        else timerFill.className='timer-fill';
        if(timeLeft<=0){ clearInterval(timerInterval); timerInterval=null; handleTimeout(); }
    },100);
}
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }

function selectOption(i){ if(answered)return; selectedOption=i;
    optionsContainer.querySelectorAll('.option-btn').forEach(function(b,j){
        b.classList.toggle('selected',j===i); b.setAttribute('aria-checked',j===i?'true':'false');
    }); confirmBtn.disabled=false; }

multiplierBtn.addEventListener('click',function(){
    if(answered||multiplierRemaining<=0||multiplierActive)return;
    multiplierActive=true; multiplierRemaining--;
    multiplierBtn.classList.add('used');
    multiplierDisplay.textContent='⚡ x2 rimasti: '+multiplierRemaining+'/4';
});

confirmBtn.addEventListener('click',function(){ if(answered||selectedOption<0)return; stopTimer(); processAnswer(selectedOption); });
function handleTimeout(){ if(answered)return; processAnswer(-1); }

function getPenalty(){ if(score<0)return 25; if(score<=1000)return 75; if(score<=3000)return 150; return 300; }

function processAnswer(chosen){
    answered=true;
    const q=questions[currentIndex], correct=q.ans;
    const elapsed=(Date.now()-startTime)/1000;
    const hasAudio=!!q.audio;
    const maxTime=hasAudio?QUIZ_META.timerAudio:QUIZ_META.timerDefault;
    const timeUsed=Math.min(elapsed,maxTime);
    const isCorrect=chosen===correct, isTimeout=chosen===-1;

    optionsContainer.querySelectorAll('.option-btn').forEach(function(b,i){
        b.classList.add('disabled');
        if(i===correct) b.classList.add('correct');
        if(i===chosen&&!isCorrect) b.classList.add('wrong');
    });

    let pointsChange=0, streakBonus=0, fbText='';
    if(isCorrect){
        pointsChange=Math.max(100,Math.round(300-(timeUsed/maxTime)*200));
        if(multiplierActive) pointsChange*=2;
        streak++; if(streak>maxStreak) maxStreak=streak;
        if(streak===3) streakBonus=50; else if(streak===5) streakBonus=100; else if(streak===7) streakBonus=200;
        score+=pointsChange+streakBonus;
        fbText='✓ Corretto!<span class="points-change">+'+pointsChange+'</span>';
        if(streakBonus>0) fbText+='<span class="streak-bonus">+'+streakBonus+' streak!</span>';
        feedbackEl.className='feedback visible correct-fb';
    } else {
        let penalty=getPenalty(); if(multiplierActive) penalty=Math.round(penalty*1.5);
        pointsChange=-penalty; score+=pointsChange; streak=0;
        fbText=isTimeout?'⏱ Tempo scaduto!':'✗ Sbagliato!';
        fbText+='<span class="points-change">'+pointsChange+'</span>';
        fbText+='<br><small>Corretta: '+q.opts[correct]+'</small>';
        feedbackEl.className='feedback visible wrong-fb';
    }
    feedbackEl.innerHTML=fbText;
    scoreDisplay.textContent=score+' punti';
    streakDisplay.textContent=streak>=2?'🔥'+streak:'';
    confirmBtn.style.display='none'; multiplierBtn.style.display='none';
    nextBtn.style.display=''; contestBtn.style.display='';

    // Show Unsplash credit after answer (if present)
    if(q.credit){
        let creditEl=document.getElementById('imgCredit');
        if(!creditEl){ creditEl=document.createElement('div'); creditEl.id='imgCredit'; creditEl.style.cssText='text-align:center;font-size:0.7rem;color:#8899aa;margin-top:8px;'; const imgC=document.getElementById('questionImage'); if(imgC) imgC.after(creditEl); else questionText.after(creditEl); }
        creditEl.innerHTML='📷 Photo by <a href="'+esc(q.credit.profile)+'" target="_blank" rel="noopener" style="color:#4fc3f7">'+esc(q.credit.name)+'</a> on <a href="'+esc(q.credit.url)+'" target="_blank" rel="noopener" style="color:#4fc3f7">Unsplash</a>';
        creditEl.style.display='block';
    }

    results.push({index:currentIndex,question:q.q,category:q.cat,options:q.opts,correct,chosen,isCorrect,isTimeout,points:pointsChange,streakBonus,multiplierUsed:multiplierActive,timeUsed,contest:''});
}

contestBtn.addEventListener('click',function(){ contestArea.classList.toggle('visible'); });
saveContestBtn.addEventListener('click',function(){ const t=contestText.value.trim(); if(t&&results.length>0) results[results.length-1].contest=t; contestArea.classList.remove('visible'); });

nextBtn.addEventListener('click',function(){ if(audioEl){audioEl.pause();audioEl=null;} if(bgm&&bgm.paused) bgm.play().catch(function(){}); currentIndex++; if(currentIndex>=questions.length){ if(bgm){bgm.pause();bgm=null;} showSummary(); } else showIntro(); });
function showSummary(){
    questionCard.style.display='none'; $('scoreBar').style.display='none'; summary.classList.add('visible');
    const tot=results.length, corr=results.filter(r=>r.isCorrect).length;
    const avgT=(results.reduce((s,r)=>s+r.timeUsed,0)/tot).toFixed(1);
    summaryStats.innerHTML='<div class="stat-card"><div class="stat-value">'+score+'</div><div class="stat-label">Punteggio</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+corr+'/'+tot+'</div><div class="stat-label">Corrette</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+Math.round(corr/tot*100)+'%</div><div class="stat-label">Percentuale</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+maxStreak+'</div><div class="stat-label">Max Streak</div></div>'+
        '<div class="stat-card"><div class="stat-value">'+avgT+'s</div><div class="stat-label">Tempo medio</div></div>';
    let html='';
    results.forEach(function(r,i){
        const sc=r.isCorrect?'correct-r':'wrong-r';
        const st=r.isCorrect?'✓ Corretto':(r.isTimeout?'⏱ Timeout':'✗ Sbagliato');
        const pts=r.points>=0?'+'+r.points:''+r.points;
        const bon=r.streakBonus>0?' (+'+r.streakBonus+' streak)':'';
        const mult=r.multiplierUsed?' [x2]':'';
        const cont=r.contest?'<div class="q-contest">📝 '+esc(r.contest)+'</div>':'';
        html+='<div class="summary-item" data-idx="'+i+'"><div class="q-head"><span class="q-num">#'+(i+1)+' - '+(catNames[r.category]||r.category)+'</span><span class="q-time">'+r.timeUsed.toFixed(1)+'s</span></div>'+
            '<div class="q-result '+sc+'">'+st+' '+pts+bon+mult+'</div>'+
            '<div class="q-explanation" id="exp-'+i+'"><strong>Domanda:</strong> '+esc(r.question)+'<br><strong>Corretta:</strong> '+esc(r.options[r.correct])+'<br>'+
            (r.chosen>=0&&!r.isCorrect?'<strong>Tua:</strong> '+esc(r.options[r.chosen])+'<br>':'')+
            '</div>'+cont+'</div>';
    });
    summaryList.innerHTML=html;
    summaryList.addEventListener('click',function(e){ const item=e.target.closest('.summary-item'); if(!item)return; const exp=$('exp-'+item.dataset.idx); if(exp) exp.classList.toggle('visible'); });
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

shareBtn.addEventListener('click',function(){
    const corr=results.filter(r=>r.isCorrect).length;
    let t='🎯 QUIZZONE — '+QUIZ_META.title+'\n👤 '+playerName+'\n🏆 '+score+' punti\n✅ '+corr+'/'+questions.length+'\n🔥 Max streak: '+maxStreak+'\n\n';
    results.forEach(function(r,i){
        const ic=r.isCorrect?'✅':(r.isTimeout?'⏱️':'❌');
        const pts=r.points>=0?'+'+r.points:''+r.points;
        const bon=r.streakBonus>0?' (+'+r.streakBonus+')':'';
        const mult=r.multiplierUsed?' [x2]':'';
        t+=ic+' #'+(i+1)+' '+(catNames[r.category]||r.category)+' — '+pts+bon+mult+' ('+r.timeUsed.toFixed(1)+'s)\n';
        if(r.contest) t+='   📝 '+r.contest+'\n';
    });
    navigator.clipboard.writeText(t).then(()=>{shareMsg.classList.add('visible');setTimeout(()=>shareMsg.classList.remove('visible'),3000);}).catch(()=>{
        const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        shareMsg.classList.add('visible');setTimeout(()=>shareMsg.classList.remove('visible'),3000);
    });
});

saveFileBtn.addEventListener('click',function(){
    const corr=results.filter(r=>r.isCorrect).length;
    let t='QUIZZONE — '+QUIZ_META.title+'\nGiocatore: '+playerName+'\nPunteggio: '+score+'\nCorrette: '+corr+'/'+questions.length+'\nMax streak: '+maxStreak+'\n'+'='.repeat(50)+'\n\n';
    results.forEach(function(r,i){
        const st=r.isCorrect?'CORRETTO':(r.isTimeout?'TIMEOUT':'SBAGLIATO');
        const pts=r.points>=0?'+'+r.points:''+r.points;
        t+='#'+(i+1)+' ['+( catNames[r.category]||r.category)+'] '+st+' '+pts;
        if(r.streakBonus>0) t+=' (+'+r.streakBonus+' streak)';
        if(r.multiplierUsed) t+=' [x2]';
        t+=' ('+r.timeUsed.toFixed(1)+'s)\n  Q: '+r.question+'\n  Corretta: '+r.options[r.correct]+'\n';
        if(r.chosen>=0&&!r.isCorrect) t+='  Tua: '+r.options[r.chosen]+'\n';
        if(r.contest) t+='  CONTESTAZIONE: '+r.contest+'\n';
        t+='\n';
    });
    const blob=new Blob([t],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=QUIZ_META.filename+'_'+playerName.replace(/\s+/g,'_')+'.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
});

// ============================================================
// UPLOAD RISULTATI VIA CLOUDFLARE WORKER + D1 (dual-write)
const WORKER_URL='https://quiz-results.kerberozzo89.workers.dev';
const D1_URL='https://skars-1.pages.dev/api/results';
const KNOWN_PLAYERS=['mattia','matt','jacopo','manuel','tato','gunny','ronny'];
const uploadBtn=$('uploadBtn'),uploadMsg=$('uploadMsg');
let uploadDone=false;
function doUpload(){
  if(uploadDone)return;
  uploadBtn.disabled=true;uploadBtn.textContent='Caricamento...';
  uploadMsg.className='upload-msg';uploadMsg.textContent='';
  const corr=results.filter(r=>r.isCorrect).length;
  const avgTime=(results.reduce((s,r)=>s+r.timeUsed,0)/results.length).toFixed(1);
  const now=new Date(),ts=now.toISOString();
  const dp=now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2)+'_'+('0'+now.getHours()).slice(-2)+('0'+now.getMinutes()).slice(-2)+('0'+now.getSeconds()).slice(-2);
  const pName=playerName.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const tsCompact=now.getUTCFullYear()+('0'+(now.getUTCMonth()+1)).slice(-2)+('0'+now.getUTCDate()).slice(-2)+'T'+('0'+now.getUTCHours()).slice(-2)+('0'+now.getUTCMinutes()).slice(-2)+('0'+now.getUTCSeconds()).slice(-2)+'Z';
  const uploadId=QUIZ_META.filename+'_'+pName+'_'+tsCompact;
  const resultsArr=results.map(function(r){return{question:r.question,category:r.category,correct:r.isCorrect,timeout:r.isTimeout,points:r.points,streakBonus:r.streakBonus,multiplierUsed:r.multiplierUsed,timeUsed:parseFloat(r.timeUsed.toFixed(1)),chosenOption:r.chosen>=0?r.options[r.chosen]:null,correctOption:Array.isArray(r.correct)?r.correct.map(function(c){return r.options[c]}).join(' / '):r.options[r.correct],contest:r.contest||null}});
  const payload={quizId:QUIZ_META.filename,quizTitle:QUIZ_META.title,playerName:playerName,timestamp:ts,score:score,correct:corr,total:questions.length,percentage:Math.round(corr/questions.length*100),maxStreak:maxStreak,avgTime:parseFloat(avgTime),multiplierStats:{used:4-multiplierRemaining,remaining:multiplierRemaining},results:resultsArr};
  const filePath='stats/results/'+QUIZ_META.filename+'_'+pName+'_'+dp+'.json';
  // --- Invio 1: Worker GitHub (fonte ufficiale fino allo switch) ---
  fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filePath:filePath,payload:payload,commitMessage:'Risultati: '+playerName+' - '+QUIZ_META.title})}).then(function(r){return r.json()}).then(function(d){
    if(d.success){uploadDone=true;uploadMsg.textContent='Risultati caricati!';uploadMsg.className='upload-msg visible success';uploadBtn.textContent='Caricato';}
    else{throw new Error(d.error||'Errore')}
  }).catch(function(e){uploadMsg.textContent='Errore: '+e.message;uploadMsg.className='upload-msg visible error';uploadBtn.disabled=false;uploadBtn.textContent='Riprova';});
  // --- Invio 2: D1 (dual-write, fire-and-forget, non blocca il flusso) ---
  try{fetch(D1_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uploadId:uploadId,quizId:QUIZ_META.filename,quizTitle:QUIZ_META.title,playerName:playerName,timestamp:ts,score:score,correct:corr,total:questions.length,percentage:Math.round(corr/questions.length*100),maxStreak:maxStreak,avgTime:parseFloat(avgTime),multiplierStats:{used:4-multiplierRemaining,remaining:multiplierRemaining},results:resultsArr})}).then(function(r){return r.json()}).then(function(d){console.log('[D1 dual-write]',d)}).catch(function(e){console.warn('[D1 dual-write] fallito:',e.message)})}catch(e){console.warn('[D1 dual-write] errore:',e.message)}
}
uploadBtn.addEventListener('click',doUpload);
if(KNOWN_PLAYERS.indexOf(playerName.trim().toLowerCase())>=0){setTimeout(doUpload,500);}

})();
</script>
