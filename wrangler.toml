# Configurazione locale per wrangler (d1 execute, pages dev).
#
# ATTENZIONE: Cloudflare Pages NON legge questo file per il deploy, perché
# manca `pages_build_output_dir`. I binding effettivi delle Pages Functions
# (D1 "DB" -> quizzone, D1 "GIRALETTERE_DB" -> giralettere) sono configurati
# nella dashboard: Workers & Pages -> skars-1 -> Settings -> Bindings,
# separatamente per Preview e Production. Verifica dello stato reale:
#   npx wrangler pages download config skars-1
# Aggiungere qui un binding non ha effetto sul sito.
#
# Setup DB Quizzone (storico):
#   1. wrangler d1 create quizzone
#   2. wrangler d1 execute quizzone --remote --file=db/schema.sql
#   3. Binding "DB" aggiunto in dashboard

name = "skars-1"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "quizzone"
database_id = "82d53a69-a86d-4571-8ef4-56abe67eb3a9"
