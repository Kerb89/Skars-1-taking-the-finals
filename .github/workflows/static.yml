# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare deploy folder
        run: |
          mkdir -p _site/puntate _site/stats/players _site/stats/results _site/background_music
          cp puntate/quiz_puntata*.html _site/puntate/
          cp stats/dashboard.html _site/stats/
          cp stats/players/*.json _site/stats/players/ 2>/dev/null || true
          cp stats/players/.gitkeep _site/stats/players/ 2>/dev/null || true
          cp stats/results/*.json _site/stats/results/ 2>/dev/null || true
          cp stats/results/.gitkeep _site/stats/results/ 2>/dev/null || true
          cp background_music/trivia_tension.mp3 _site/background_music/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
